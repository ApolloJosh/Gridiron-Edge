              <ZoneBar zones={sum.zones} zoned={sum.zoned} />
              <div style={{ fontSize: 9.5, color: T.inkFaint, marginTop: 8, lineHeight: 1.5 }}>
                A calibrated projection puts about a quarter of results in each band. Weight to the
                right means the numbers are too low and the overs are live; weight to the left means
                the opposite.
              </div>
              <div style={{ height: 1, background: T.chalkFaint, margin: "14px 0" }} />
              <LandingChart picks={picks} />
            </Panel>

            {/* by position */}
            <Panel style={{ padding: "14px 16px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1, marginBottom: 10 }}>
                OVER RATE BY POSITION
              </div>
              <div style={{ display: "flex", gap: 26, flexWrap: "wrap" }}>
                {byPos.map(([pos, v]) => (
                  <StatTile key={pos} label={pos}
                    value={isNaN(v.overRate) ? "—" : Math.round(v.overRate) + "%"}
                    sub={`${v.overN}/${v.clean} clean`} tone={rateTone(v.overRate)} />
                ))}
              </div>

            {/* set-aside picks, so the exclusion is auditable */}
            {flagged.length > 0 && (
              <Panel style={{ padding: "14px 16px", marginBottom: 12 }}>
                <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1, marginBottom: 9 }}>

                        <td style={{ padding: "5px 7px", color: T.inkDim }}>{p.team} vs {p.opp}</td>

                        <td style={{ padding: "5px 7px", color: T.inkFaint }}>
                          {isFinite(p.p25) ? `${p.p25.toFixed(0)}–${p.p75.toFixed(0)}` : "—"}
                        </td>
                        <td style={{ padding: "5px 7px", color: T.chalk }}>{p.played ? p.act.toFixed(0) : "DNP"}</td>
                        <td style={{ padding: "5px 7px", fontWeight: 600, color: !p.played ? T.inkFaint : p.collapsed ? T.inkDim : p.over ? OVER_C : UNDER_C }}>
                          {!p.played ? "—" : p.collapsed ? "set aside" : p.over ? "▲ over" : "▼ under"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </Panel>
            )}

            <Panel style={{ padding: "14px 16px", marginBottom: 16 }}>
              <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1, marginBottom: 9 }}>
                WHAT THIS SAYS FOR NEXT WEEK
              </div>
              <ul style={{ margin: 0, paddingLeft: 18, fontSize: 11.5, color: T.inkDim, lineHeight: 1.7 }}>
                <li>
                  {isNaN(sum.overRate) ? "Not enough clean picks yet to read an over rate."
                    : sum.overRate >= 55 ? `Overs are landing at ${Math.round(sum.overRate)}% on this cohort — the projected medians are sitting low, so the over is the right side.`
                    : sum.overRate <= 45 ? `Overs are landing at only ${Math.round(sum.overRate)}% — these medians are set too high for this cohort. Shade down or take unders.`
                    : `At ${Math.round(sum.overRate)}% this cohort is a coin flip. No edge on the over from the ranking alone.`}
                </li>
                {!isNaN(sum.medErr) && Math.abs(sum.medErr) >= 5 && (
                  <li>The median misses by {sum.medErr > 0 ? "+" : ""}{sum.medErr.toFixed(0)} yards
                    {sum.medErr > 0 ? " on the high side — the number to bet is below what's shown." : " on the low side — there's room above the posted number."}</li>
                )}
                {byPos.length > 1 && (() => {
                  const ranked = byPos.filter((x) => x[1].clean >= 3 && !isNaN(x[1].overRate))
                    .sort((a, b) => b[1].overRate - a[1].overRate);
                  if (ranked.length < 2) return null;
                  const [best, worst] = [ranked[0], ranked[ranked.length - 1]];
                  return <li><strong>{best[0]}</strong> is the strongest position at {Math.round(best[1].overRate)}% over,
                    <strong> {worst[0]}</strong> the weakest at {Math.round(worst[1].overRate)}%. Weight parlays accordingly.</li>;
                })()}
                {sum.flagged > 0 && (
                  <li>{sum.flagged} pick{sum.flagged > 1 ? "s" : ""} set aside for collapsed workload. If that
                    keeps happening to the same kind of player, the injury report is worth reading before you bet.</li>
                )}
                {sum.dnp > 0 && (
                  <li>{sum.dnp} never played at all — those are board bugs rather than bad reads, and worth chasing down.</li>
                )}
              </ul>
            </Panel>
          </>
        )}
      </div>
    </div>
  );
}

function Stat({ label, value, g, sub }) {

/** The range display — the headline, per the backtest. */
function RangeBar({ band, label }) {
  if (!band) return null;
  const lo = Math.min(band.min, band.p25adj), hi = Math.max(band.max, band.p75adj);
  const span = Math.max(hi - lo, 1);
  const pct = (v) => clamp(((v - lo) / span) * 100, 0, 100);
  return (
    <div style={{ marginTop: 4 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
        <span style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 30, fontWeight: 700,
          color: T.gold, lineHeight: 1,
        }}>{band.p25adj.toFixed(0)}–{band.p75adj.toFixed(0)}</span>
        <span style={{ fontSize: 10, color: "#e8c9ac", letterSpacing: .5 }}>
          {label} · middle 50% of {band.n} games
        </span>
      </div>
      <div style={{ position: "relative", height: 22, marginTop: 7 }}>
        <div style={{
          position: "absolute", top: 9, left: 0, right: 0, height: 3,
          background: "rgba(255,255,255,.13)", borderRadius: 2,
        }} />
        <div style={{
          position: "absolute", top: 7, height: 7, borderRadius: 3, background: T.gold,
          left: `${pct(band.p25adj)}%`, width: `${Math.max(pct(band.p75adj) - pct(band.p25adj), 1)}%`,
          boxShadow: SHADOW_SM,
        }} />
        {band.values.map((v, i) => (
          <div key={i} title={String(v)} style={{
            position: "absolute", top: 3, width: 2, height: 15, borderRadius: 1,
            background: "rgba(255,255,255,.55)", left: `${pct(v)}%`,
          }} />
        ))}
        <div style={{
          position: "absolute", top: 0, width: 2, height: 21, background: T.chalk,
          left: `${pct(band.medianAdj)}%`, boxShadow: "0 0 4px rgba(0,0,0,.7)",
        }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: T.inkFaint }}>
        <span>low {band.min.toFixed(0)}</span>
        <span>median {band.medianAdj.toFixed(0)}</span>
        <span>high {band.max.toFixed(0)}</span>
      </div>
    </div>
  );
}

/** Prop-line hit rate, with the mean-reversion warning the data demands. */
function HitRate({ band, label }) {
  const [line, setLine] = useState("");
  if (!band) return null;
  const L = num(line);
  const over = !isNaN(L) ? band.values.filter((v) => v > L).length : null;
  return (
    <div style={{ marginTop: 11, paddingTop: 10, borderTop: `1px solid ${T.chalkFaint}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10, color: "#e8c9ac", letterSpacing: .5 }}>BOOK'S LINE</span>
        <input value={line} onChange={(e) => setLine(e.target.value)} placeholder={label}
          inputMode="decimal" style={{ width: 84 }} />
        {over !== null && (
          <>
            <span style={{
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 20, fontWeight: 700,
              color: over / band.n >= .6 ? T.gold : over / band.n <= .4 ? T.bad : T.chalk,
            }}>{over}/{band.n}</span>
            <span style={{ fontSize: 11, color: T.inkDim }}>
              over ({((over / band.n) * 100).toFixed(0)}%)
            </span>
          </>
        )}
      </div>
      {over !== null && (
        <div style={{ fontSize: 9, color: T.inkFaint, marginTop: 6, lineHeight: 1.5 }}>
          Past hit rate is <strong>mean-reverting, not predictive</strong> — measured correlation
          between a player's first-half and second-half over-rate was −0.41. Use this to see the
          shape of his distribution, not as a reason to bet the streak.
        </div>
      )}
    </div>
  );
}

function GameLogStrip({ log, statKey, label, opp }) {
  if (!log?.length) return null;
  const vals = log.map((g) => ({ w: g.week, v: g.stats[statKey], opp: g.opp, home: g.home }))
    .filter((x) => !isNaN(x.v));
  if (!vals.length) return null;
  const max = Math.max(...vals.map((v) => v.v), 1);
  return (
    <div style={{ marginTop: 11 }}>
      <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: 1, marginBottom: 6 }}>
        GAME LOG · {label}
      </div>
      <div style={{ display: "flex", gap: 3, alignItems: "flex-end", height: 46 }}>
        {vals.map((x, i) => {
          const isOpp = x.opp === opp;
          return (
            <div key={i} title={`Wk ${x.w} ${x.home ? "vs" : "@"} ${x.opp}: ${x.v}`}
              style={{ flex: "1 1 0", display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }}>
              <div style={{
                height: `${Math.max((x.v / max) * 100, 2)}%`,
                background: isOpp ? T.gold : "rgba(255,255,255,.32)",

      <div style={{ fontSize: 9, color: T.inkFaint, marginTop: 5 }}>
        {vals.length} games · gold = previous meeting with {opp}

    </div>
  );
}

function FactorChain({ factors }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 9 }}>
      {factors.map((f) => {
        const pending = f.pending || !f.active;

        return (
          <span key={f.key} title={f.note || ""} style={{

            borderRadius: 3, padding: "3px 8px", fontSize: 10,

const SCAN_TABS = [
  { key: "QB",  label: "QB",  match: (r) => r.pos === "QB" },
  { key: "RB",  label: "RB",  match: (r) => ["RB", "FB"].includes(r.pos) },

];

function ScanRow({ rank, row, onOpen }) {

function Scanner({ scan, scanning, progress, league, week, onOpen, onRescan }) {
  const [tab, setTab] = useState("QB");
  const [includePlayed, setIncludePlayed] = useState(false);
  const [startersOnly, setStartersOnly] = useState(true);
  const [sortBy, setSortBy] = useState("proj");   // proj | edge
  const allRows = scan?.rows || [];
  const active = SCAN_TABS.find((t) => t.key === tab);
  const rows = useMemo(() => {
    let rs = includePlayed ? allRows : allRows.filter((r) => !r.started);
    if (startersOnly) rs = rs.filter((r) => r.kind === "DEF" || r.depth == null
      || DEPTH_LIMIT[r.pos] === undefined || r.depth <= DEPTH_LIMIT[r.pos]);
    return rs;
  }, [allRows, includePlayed, startersOnly]);
  const projOf = (r) => {
    const h = r.analysis?.headline;
    const v = h ? r.analysis.projected[h.key] : NaN;
    return isFinite(v) ? v : -1;
  };
  const top = useMemo(() => {
    const list = rows.filter(active.match);
    list.sort(sortBy === "proj" ? (a, b) => projOf(b) - projOf(a) : (a, b) => b.score - a.score);
    return list.slice(0, 10);
  }, [rows, tab, sortBy]);
  const counts = useMemo(() => {
    const c = {};
    SCAN_TABS.forEach((t) => { c[t.key] = rows.filter(t.match).length; });
    return c;
  }, [rows]);
  const hiddenCount = allRows.length - rows.length;

  return (

      <div style={{ flexShrink: 0, marginBottom: 14 }}>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 32, fontWeight: 700,
          letterSpacing: 1.5, lineHeight: 1.05, color: T.chalk,

        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          Top 10 at each position{scan?.games ? ` · ${scan.games.length} games` : ""}
          {league?.season ? ` · ${league.season} stats` : ""}
          {scan && scan.statYear !== scan.scanYear && (
            <span style={{ color: T.gold }}> (prior season — {scan.scanYear} has no usable sample yet)</span>
          )}
        </div>
        {scan && (scan.played > 0 || scan.live > 0) && (
          <div style={{
            marginTop: 9, padding: "8px 11px", borderRadius: 4, fontSize: 11,
            background: "rgba(107,52,16,.34)", border: `1px solid rgba(139,74,28,.7)`,
            color: "#f0c9a8", lineHeight: 1.55,
          }}>
            {scan.played > 0 && <strong>{scan.played} game{scan.played > 1 ? "s" : ""} already final</strong>}
            {scan.played > 0 && scan.live > 0 && " · "}
            {scan.live > 0 && <strong>{scan.live} in progress</strong>}
            {" — "}
            {includePlayed ? "shown below and marked."
              : `hidden (${hiddenCount} player${hiddenCount === 1 ? "" : "s"} excluded).`}

      <div className="gx-tabs" style={{ display: "flex", gap: 7, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        {SCAN_TABS.map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            padding: "7px 16px", fontSize: 13, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: tab === t.key ? T.gold : "rgba(0,0,0,.3)",
            color: tab === t.key ? T.leatherDark : T.ink,
            border: `1px solid ${tab === t.key ? T.gold : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: 1,
            boxShadow: tab === t.key ? SHADOW_SM : "none",
          }}>{t.label}<span style={{ opacity: .65, fontSize: 10, marginLeft: 6 }}>{counts[t.key] || 0}</span></button>
        ))}
        <div style={{ marginLeft: "auto", display: "inline-flex", alignItems: "center", gap: 4 }}>
          <span style={{ fontSize: 9, color: T.inkFaint, letterSpacing: .8, marginRight: 2 }}>SORT</span>
          {[["proj", "Proj yds"], ["edge", "EDGE"]].map(([k, lbl]) => (
            <button key={k} onClick={() => setSortBy(k)} style={{
              padding: "5px 10px", fontSize: 11, fontWeight: 600, borderRadius: 3, cursor: "pointer",
              background: sortBy === k ? "rgba(255,199,44,.18)" : "rgba(0,0,0,.3)",
              color: sortBy === k ? T.gold : T.inkDim,
              border: `1px solid ${sortBy === k ? T.gold : T.chalkDim}`, minHeight: 32,
            }}>{lbl}</button>
          ))}
        </div>
        <label style={{
          display: "inline-flex", alignItems: "center", gap: 6,
          fontSize: 11, color: T.inkDim, cursor: "pointer", userSelect: "none",
        }}>
          <input type="checkbox" checked={startersOnly}
            onChange={(e) => setStartersOnly(e.target.checked)}
            style={{ accentColor: T.gold, cursor: "pointer", width: "auto" }} />
          Starters only
        </label>
        <label style={{
          display: "inline-flex", alignItems: "center", gap: 6,
          fontSize: 11, color: T.inkDim, cursor: "pointer", userSelect: "none",
        }}>
          <input type="checkbox" checked={includePlayed}
            onChange={(e) => setIncludePlayed(e.target.checked)}
            style={{ accentColor: T.gold, cursor: "pointer", width: "auto" }} />
          Include played games
        </label>
        <button onClick={onRescan} disabled={scanning} style={{
          padding: "7px 14px", fontSize: 11, fontWeight: 600, borderRadius: 3,
          cursor: scanning ? "default" : "pointer", background: "rgba(0,0,0,.3)",
          color: scanning ? T.inkFaint : T.ink, border: `1px solid ${T.chalkDim}`,
        }}>{scanning ? "Scanning…" : "↻ Rescan"}</button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        {scanning && (
          <Panel style={{ padding: "30px 20px", textAlign: "center" }}>
            <div className="pulsing" style={{
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 18, letterSpacing: 2.5, color: T.gold,
            }}>SCANNING THE SLATE…</div>
            <div style={{ fontSize: 11, color: T.inkDim, marginTop: 8 }}>{progress}</div>
          </Panel>
        )}
        {!scanning && scan?.empty && (
          <Panel style={{ padding: "22px 18px", fontSize: 12, color: T.inkDim }}>
            No games scheduled for this week.
          </Panel>
        )}
        {!scanning && !scan?.empty && top.length === 0 && (
          <Panel style={{ padding: "22px 18px", fontSize: 12, color: T.inkDim }}>
            No qualifying {active.label} met the volume threshold for this slate.
          </Panel>
        )}
        {!scanning && top.length > 0 && (
          <Panel style={{ overflow: "hidden" }}>
            <div style={{
              display: "flex", alignItems: "center", gap: 8, padding: "8px 12px",
              background: "rgba(0,0,0,.25)", fontSize: 9, letterSpacing: 1.3,
              color: T.inkFaint, fontWeight: 600,
            }}>TOP 10 {active.label} BY {sortBy === "proj" ? "PROJECTED YARDS" : "EDGE"} · RANGE IS THE MIDDLE 50% OF HIS GAMES · CLICK FOR THE FULL MATCHUP</div>
            <ChalkLine />
            {top.map((row, i) => <ScanRow key={row.player.id} rank={i + 1} row={row} onOpen={onOpen} />)}
          </Panel>
        )}
        {!scanning && scan?.byes?.length > 0 && (
          <div style={{ fontSize: 10, color: T.inkFaint, marginTop: 12 }}>
            On bye (excluded): {scan.byes.join(" · ")}
          </div>

        {!scanning && top.length > 0 && (
          <div style={{ fontSize: 10, color: T.inkFaint, lineHeight: 1.6, padding: "12px 0 22px" }}>
            Ranges come from each player's game log — a 25–75 band held the actual result 47.7% of
            the time in backtesting, against an ideal 50%. The point estimate is far less reliable:
            median game-to-game variation is ~60% of a player's average. See docs/model.md.
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------ game view ------------------------------ */

function GameView({ game, league, tables, year, posMean, env, onBack }) {
  const secRefs = {
    QB: useRef(null), REC: useRef(null), RB: useRef(null), DEF: useRef(null),
  };
  const [side, setSide] = useState("home");
  const [detail, setDetail] = useState(null);
  const [groups, setGroups] = useState({ QB: [], REC: [], RB: [], DEF: [] });
  const [logs, setLogs] = useState({});
  const [starter, setStarter] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const reqId = useRef(0);

  const off = side === "home" ? game.home : game.away;
  const def = side === "home" ? game.away : game.home;
  const defRow = tables?.defense?.[def.abbr];
  const offRow = tables?.offense?.[def.abbr];
  const imp = impliedTotals(game);

  useEffect(() => { getGameDetail(game.id).then(setDetail); }, [game.id]);

  useEffect(() => {
    const my = ++reqId.current;
    setLoading(true); setErr(null); setGroups({ QB: [], REC: [], RB: [], DEF: [] });
    (async () => {
      try {
        const [offRoster, defRoster] = await Promise.all([getRoster(off.id), getRoster(def.id)]);
        if (!offRoster.length) throw new Error("roster unavailable");
        const offWant = offRoster.filter((p) => OFF_POS.includes(p.pos));
        const defWant = defRoster.filter((p) => DEF_POS.includes(p.pos));
        const all = [...offWant, ...defWant];
        const stats = await pool(all, 8, (p) => getAthleteSeason(p.id, league.season));
        if (my !== reqId.current) return;

        const offInj = detail?.injuries?.[off.abbr] || [];
        const defInj = detail?.injuries?.[def.abbr] || [];
        const dec = (p, i, inj) => ({ ...p, stats: stats[i], injury: inj.find((x) => x.name === p.name) || null });
        const offPlayers = offWant.map((p, i) => dec(p, i, offInj)).filter((p) => p.stats);
        const defPlayers = defWant.map((p, i) => dec(p, offWant.length + i, defInj)).filter((p) => p.stats);
        const v = (p, cat, key) => num(p.stats?.[cat]?.[key]) || 0;
        const dv = (p) => num(defStat(p.stats, ["totalTackles"])) || 0;

        /* One quarterback, resolved the same way the board does it. Taking
           the top two by attempts is how a backup ended up projected for 100
           yards in a game he would never enter. */
        /* Depth chart and usage must come from the CURRENT season, not the
           stats season — a 2025 chart would name last year's starter. */
        const [chart, usage] = await Promise.all([
          getDepthChart(off.id, year), getQbUsage(year),
        ]);
        const st = resolveStarterQB(off.abbr, chart.qb, detail?.injuriesById?.[off.abbr], usage);
        if (my !== reqId.current) return;
        setStarter(st);
        const qbPool = offWant.filter((p) => p.pos === "QB");
        let qbShow = [];
        if (st) {
          /* Never substitute a different quarterback. If the resolved starter
             has no prior-season line (a rookie, or a first-time starter), show
             HIM with whatever exists — falling back to "whoever threw most last
             season" is precisely how Jameis Winston displaced Jaxson Dart. */
          const idx = qbPool.findIndex((p) => String(p.id) === st.id);
          if (idx >= 0) {
            const base = offPlayers.find((p) => String(p.id) === st.id);
            qbShow = [base || { ...qbPool[idx], stats: null, noPriorData: true }];
          }
        }
        if (!qbShow.length) {
          qbShow = offPlayers.filter((p) => p.pos === "QB")
            .sort((a, b) => v(b, "passing", "passingAttempts") - v(a, "passing", "passingAttempts")).slice(0, 1);
        }
        const g = {
          QB: qbShow,
          REC: offPlayers.filter((p) => ["WR", "TE"].includes(p.pos))
            .sort((a, b) => v(b, "receiving", "receivingYards") - v(a, "receiving", "receivingYards")).slice(0, 5),
          RB: offPlayers.filter((p) => ["RB", "FB"].includes(p.pos))
            .sort((a, b) => v(b, "rushing", "rushingAttempts") - v(a, "rushing", "rushingAttempts")).slice(0, 3),
          DEF: defPlayers.sort((a, b) => dv(b) - dv(a)).slice(0, 6),
        };
        setGroups(g);
        setLoading(false);

        const skill = [...g.QB, ...g.REC, ...g.RB];
        const ls = await pool(skill, 8, (p) => getGameLog(p.id, league.season));
        if (my !== reqId.current) return;
        const map = {};
        skill.forEach((p, i) => { if (ls[i]) map[p.id] = ls[i]; });
        setLogs(map);
      } catch (e) {
        if (my !== reqId.current) return;
        setErr(e.message); setLoading(false);
      }
    })();
  }, [game.id, side, off.id, def.id, detail, league.season, year]);

  const when = useMemo(() => {
    const d = new Date(game.date);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
      + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }, [game.date]);

  const wx = detail?.weather;
  const indoor = game.indoor || detail?.indoor;
  const temp = num(wx?.temp), gust = num(wx?.gust);
  const divisional = DIVISION[game.home.abbr] && DIVISION[game.home.abbr] === DIVISION[game.away.abbr];
  const offInjuries = detail?.injuries?.[off.abbr] || [];
  const impliedFor = imp ? (side === "home" ? imp.home : imp.away) : null;

  /* One ctx object per player, memoised so PlayerCard's own useMemo holds and
     so each group can be ordered by its projected headline number. */
  const ordered = useMemo(() => {
    const build = (list, kind) => (list || []).map((p) => {
      const log = logs[p.id] || null;
      const ctx = {
        defAbbr: def.abbr, defRow, offRow, league: tables?.league, teams: tables?.teams || 32,
        wx, indoor, implied: impliedFor, log,
        oppHistory: log ? log.filter((g) => g.opp === def.abbr) : null,
        posMean, crossSeason: league.season !== year, env, statSeason: league.season,
      };
      const a = analyze(p, kind, ctx);
      const head = a.headline;
      const proj = head && isFinite(a.projected[head.key]) ? a.projected[head.key] : -1;
      return { p, ctx, kind, proj };
    }).sort((x, y) => y.proj - x.proj);
    return {
      QB: build(groups.QB, "QB"), REC: build(groups.REC, "REC"),
      RB: build(groups.RB, "RB"), DEF: build(groups.DEF, "DEF"),
    };
  }, [groups, logs, def.abbr, defRow, offRow, tables, wx, indoor, impliedFor, posMean, env, league.season, year]);

  const jump = (k) => secRefs[k]?.current?.scrollIntoView({ behavior: "smooth", block: "start" });

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flexShrink: 0, marginBottom: 13 }}>
        <button onClick={onBack} style={{
          background: "none", border: "none", color: T.gold, fontSize: 11,
          cursor: "pointer", padding: 0, marginBottom: 6, fontFamily: "'Inter',sans-serif",
        }}>← Back to Edge Board</button>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 34, fontWeight: 700,
          letterSpacing: 1.5, lineHeight: 1.05, color: T.chalk,
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 12px rgba(0,0,0,.5)`,
        }}>
          {game.away.abbr} <span style={{ color: T.gold, fontSize: 21, fontWeight: 400 }}>at</span> {game.home.abbr}
        </div>
        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          {when} · {game.venue || "TBD"}
        </div>
        <div style={{ display: "flex", gap: 7, marginTop: 9, flexWrap: "wrap" }}>
          {imp && <Badge icon="💰" label={`${game.away.abbr} ${imp.away.toFixed(1)} — ${game.home.abbr} ${imp.home.toFixed(1)} implied`} tone="warm" />}
          {imp && <Badge label={`O/U ${imp.total} · spread ${imp.spread > 0 ? "+" : ""}${imp.spread}${imp.provider ? ` (${imp.provider})` : ""}`} />}
          {!indoor && !isNaN(gust) && gust >= 15 && <Badge icon="💨" label={`Gusts ${Math.round(gust)} mph`} tone="cold" />}
          {!indoor && !isNaN(temp) && temp < 35 && <Badge icon="🧊" label={`${Math.round(temp)}°F`} tone="cold" />}
          {indoor && <Badge icon="🏟" label="Indoor" />}
          {divisional && <Badge icon="⚔" label={`Divisional — trends under`} tone="leather" />}
          {game.state && game.state !== "pre" && <Badge label={game.status} tone="cold" />}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        {[["away", game.away, game.home], ["home", game.home, game.away]].map(([s, o, d]) => (
          <button key={s} onClick={() => setSide(s)} style={{
            padding: "8px 15px", fontSize: 12.5, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: side === s ? T.gold : "rgba(0,0,0,.3)",
            color: side === s ? T.leatherDark : T.ink,
            border: `1px solid ${side === s ? T.gold : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: .8,
          }}>{o.name} <span style={{ opacity: .7, fontSize: 10 }}>offense vs {d.abbr} D</span></button>
        ))}
      </div>

      {/* jump nav — beats scrolling past four sections to reach the backs */}
      <div className="gx-tabs" style={{
        display: "flex", gap: 6, marginBottom: 12, flexShrink: 0, flexWrap: "wrap",
        alignItems: "center",
      }}>
        <span style={{ fontSize: 9, color: T.inkFaint, letterSpacing: 1, marginRight: 2 }}>JUMP TO</span>
        {[["QB", "🎯 QB", ordered.QB.length], ["REC", "⚡ WR/TE", ordered.REC.length],
          ["RB", "🏃 RB", ordered.RB.length], ["DEF", `🛡 ${def.abbr} D`, ordered.DEF.length]].map(
          ([k, label, n]) => (
          <button key={k} onClick={() => jump(k)} disabled={!n} style={{
            padding: "6px 12px", fontSize: 12, fontWeight: 700, borderRadius: 3,
            cursor: n ? "pointer" : "default", background: "rgba(0,0,0,.3)",
            color: n ? T.ink : T.inkFaint, border: `1px solid ${T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: .8, minHeight: 34,
          }}>{label}<span style={{ opacity: .6, fontSize: 10, marginLeft: 5 }}>{n}</span></button>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        <DefenseCard def={defRow} off={offRow} league={tables?.league} defAbbr={def.abbr}
          season={tables?.season} implied={impliedFor} />

        {offInjuries.length > 0 && (
          <Panel style={{ padding: "11px 14px", marginBottom: 14 }}>
            <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: .8, marginBottom: 8 }}>
              {off.abbr} INJURY REPORT
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {offInjuries.slice(0, 12).map((x, i) => (
                <Badge key={i} tone={/out|doubtful/i.test(x.status) ? "cold" : "neutral"}
                  label={`${x.name}${x.pos ? ` (${x.pos})` : ""} — ${x.status}`} />
              ))}
            </div>
          </Panel>
        )}

        {err && <div style={{ color: T.poor, fontSize: 12, padding: "10px 0" }}>Could not load: {err}</div>}
        {loading && (
          <div className="pulsing" style={{
            textAlign: "center", padding: 40, color: T.inkDim,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, letterSpacing: 2.5,
          }}>LOADING ROSTERS & SEASON STATS…</div>
        )}

        {!loading && (
          <>
            <div ref={secRefs.QB} style={{ scrollMarginTop: 8 }} />
            <SectionTitle right={`${def.abbr} allows ${fmt(defRow?.passYdsPg)} pass yds/g`}>🎯 Quarterback</SectionTitle>
            {starter && (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                <Badge label={`Starter via ${starter.via}`} tone="warm" icon="✓" />
                {starter.promotedFrom && (
                  <Badge tone="cold" icon="⚠"
                    label={`promoted — listed starter ${starter.promotedFrom.status}`} />
                )}
                {starter.conflict && (
                  <Badge tone="cool" icon="?"
                    label={`QB situation unclear — ${starter.conflict.name} leads the team with ${starter.conflict.att} attempts`} />
                )}
              </div>
            )}
            {ordered.QB.map(({ p, ctx }) => <PlayerCard key={p.id} p={p} kind="QB" ctx={ctx} />)}
            <div ref={secRefs.REC} style={{ scrollMarginTop: 8 }} />
            <SectionTitle right={`${ordinal(defRow?.rankPassYds)} vs the pass · sorted by projected yards`}>⚡ Receivers &amp; Tight Ends</SectionTitle>
            {ordered.REC.map(({ p, ctx }) => <PlayerCard key={p.id} p={p} kind="REC" ctx={ctx} />)}
            <div ref={secRefs.RB} style={{ scrollMarginTop: 8 }} />
            <SectionTitle right={`${def.abbr} allows ${fmt(defRow?.ypcAllowed, 2)} per carry · sorted by projected yards`}>🏃 Running Backs</SectionTitle>
            {ordered.RB.map(({ p, ctx }) => <PlayerCard key={p.id} p={p} kind="RB" ctx={ctx} />)}
            <div ref={secRefs.DEF} style={{ scrollMarginTop: 8 }} />
            <SectionTitle right={`${off.abbr} runs ${fmt(tables?.offense?.[off.abbr]?.playsPg)} plays/g · sorted by projected tackles`}>🛡 {def.abbr} Defenders</SectionTitle>
            {ordered.DEF.map(({ p, ctx }) => <PlayerCard key={p.id} p={p} kind="DEF" ctx={ctx} />)}
            <div style={{ fontSize: 10, color: T.inkFaint, lineHeight: 1.6, padding: "4px 0 22px" }}>
              Opponent factors are applied at measured strength: passing ^{PASS_OPP_EXP}, rushing ^{RUSH_OPP_EXP}.
              Rushing is near-zero because that's what the backtest found — full-strength opponent
              adjustment made rushing projections worse. Price everything against your book's line.
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* --------------------------------- app --------------------------------- */

function seasonHasSample(standings) {
  if (!standings.length) return false;
  const gps = standings.map((t) => t.gp || 0).sort((a, b) => a - b);
  return gps[Math.floor(gps.length / 2)] >= 4;
}
function walkStandings(node, out = []) {
  if (!node) return out;
  if (node.standings?.entries) out.push(...node.standings.entries);
  (node.children || []).forEach((c) => walkStandings(c, out));
  return out;
}
async function getStandings(year) {
  const d = await safeJSON(`${ESPN_V2}/standings?season=${year}`);
  if (!d) return [];
  return walkStandings(d).map((e) => {
    const s = {};
    (e.stats || []).forEach((x) => { s[x.name] = x.value !== undefined ? x.value : num(x.displayValue); });
    return { abbr: e.team?.abbreviation, gp: (s.wins || 0) + (s.losses || 0) + (s.ties || 0) };
  }).filter((t) => t.abbr);
}
/** Which season's stats should we use? Week 1 trap: test the MEDIAN team. */
async function resolveStatSeason(year) {
  const cur = await getStandings(year);
  if (seasonHasSample(cur)) return year;
  const prior = await getStandings(year - 1);
  return seasonHasSample(prior) ? year - 1 : year;
}

function App() {
  const now = new Date();
  const defaultYear = now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear();
  const [year, setYear] = useState(defaultYear);
  const [seasonType, setSeasonType] = useState(2);
  const [week, setWeek] = useState(null);
  const [sched, setSched] = useState({ games: [], byes: [] });
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("board");   // board | report
  const [league, setLeague] = useState(null);
  const [tables, setTables] = useState(null);
  const [env, setEnv] = useState(null);
  const [dbProgress, setDbProgress] = useState("");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [scan, setScan] = useState(null);
  const [scanning, setScanning] = useState(false);
  const [progress, setProgress] = useState("");
  const scanKey = useRef("");

  useEffect(() => {
    (async () => {
      const d = await safeJSON(`${ESPN}/scoreboard`);
      setWeek(d?.week?.number || 1);
      if (d?.season?.year) setYear(d.season.year);
      if (d?.season?.type) setSeasonType(d.season.type);
    })();
  }, []);

  /* Season database: the real yards-allowed source. Cached after first build. */
  useEffect(() => {
    (async () => {
      setDbProgress("Resolving season…");
      const statSeason = await resolveStatSeason(defaultYear);
      setLeague({ season: statSeason });
      const db = await buildSeasonDB(statSeason, setDbProgress);
      const t = db ? leagueTables(db) : null;
      if (t) setTables(t);
      /* When projecting off a prior season, measure how far this one has
         drifted. Keyed by completed-game count so it refreshes each week. */
      if (t && statSeason !== defaultYear) {
        setDbProgress("Measuring this season's scoring environment…");
        const liveDb = await buildSeasonDB(defaultYear, null, `live${new Date().toISOString().slice(0, 10)}`);
        setEnv(leagueEnv(liveDb, t));
      } else {
        setEnv({ pass: 1, rush: 1, n: 0 });
      }
      setDbProgress("");
    })();
  }, [defaultYear]);

  useEffect(() => {
    if (!week) return;
    setLoading(true); setError(null); setSelected(null);
    getSchedule(year, week, seasonType)
      .then((s) => { setSched(s); setLoading(false); })
      .catch((e) => { setError(e.message); setLoading(false); });
  }, [year, week, seasonType]);

  const doScan = useCallback(async (force) => {
    if (!league || !tables || !env || !week) return;
    const key = `${year}-${week}-${seasonType}-${league.season}`;
    if (!force && scanKey.current === key) return;
    scanKey.current = key;
    if (force) clearCache();
    setScanning(true); setScan(null);
    try {
      setScan(await runScan({ year, week, seasonType, league, tables, env, onProgress: setProgress }));
    } catch (e) { setScan({ rows: [], error: e.message }); }
    setScanning(false);
  }, [league, tables, env, week, year, seasonType]);

  useEffect(() => { doScan(false); }, [doScan]);

  /* Insurance against a lost week. A week is only gradeable from projections
     captured before its games kicked off, and that used to require remembering
     to open the app mid-week. Once this week's scan lands, quietly scan NEXT
     week in the background and snapshot it. Nothing renders from it; it just
     means skipping a week no longer erases it from the Over Board. */
  const preSnapped = useRef(new Set());
  useEffect(() => {
    if (!scan || scan.error || scanning || !league || !tables || !env || !week) return;
    if (seasonType !== 2) return;
    const nw = week + 1;
    if (nw > 18 || preSnapped.current.has(nw)) return;
    preSnapped.current.add(nw);
    if (store.get(`gx_proj_${year}_${nw}`)) return;
    (async () => {
      try {
        const s = await getSchedule(year, nw, 2);
        if (!s.games.length || s.games.every(hasStarted)) return;
        await runScan({ year, week: nw, seasonType: 2, league, tables, env });
      } catch {}
    })();
  }, [scan, scanning, league, tables, env, week, year, seasonType]);

  const weeks = seasonType === 2 ? 18 : 5;

  return (
    <div className="field gx-app" style={{
      fontFamily: "'Inter',sans-serif", height: "100vh", display: "flex", flexDirection: "column",
    }}>
      <div className="gx-header" style={{
        padding: "11px 18px", display: "flex", alignItems: "center", gap: 14,
        background: "linear-gradient(180deg, rgba(10,45,26,.95), rgba(10,45,26,.72))",
        borderBottom: `2px solid ${T.chalk}`, flexShrink: 0, flexWrap: "wrap",
        boxShadow: `0 3px 0 ${T.leatherDark}, 0 8px 20px rgba(0,0,0,.4)`, zIndex: 2,
      }}>
        <div onClick={() => { setSelected(null); setView("board"); }} style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 25, fontWeight: 700,
          letterSpacing: 2.5, color: T.gold, cursor: "pointer",
          textShadow: `0 2px 0 ${T.leatherDark}, 0 4px 10px rgba(0,0,0,.55)`,
        }}>🏈 GRIDIRON EDGE</div>
        <div className="gx-tagline" style={{ color: T.inkDim, fontSize: 10, letterSpacing: 1.4, paddingTop: 3 }}>
          NFL MATCHUP ANALYSIS · APOLLO MEDIA
        </div>
        <div title="Build version — check this after updating the file" style={{
          fontSize: 9, color: T.inkFaint, border: `1px solid ${T.chalkFaint}`,
          borderRadius: 3, padding: "2px 6px", letterSpacing: .5, whiteSpace: "nowrap",
        }}>{BUILD}</div>
        <div className="gx-controls" style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          <select value={seasonType} onChange={(e) => { setSeasonType(+e.target.value); setWeek(1); }}>
            <option value={2}>Regular season</option>
            <option value={3}>Postseason</option>
          </select>
          <select value={week || 1} onChange={(e) => setWeek(+e.target.value)}>
            {Array.from({ length: weeks }, (_, i) => i + 1).map((w) => <option key={w} value={w}>Week {w}</option>)}
          </select>
          <select value={year} onChange={(e) => setYear(+e.target.value)}>
            {[defaultYear, defaultYear - 1, defaultYear - 2].map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>

      <div className="gx-shell" style={{ display: "flex", flex: 1, overflow: "hidden" }}>
        <div className="gx-side" style={{
          width: 224, borderRight: `2px solid ${T.chalkDim}`, overflowY: "auto",
          padding: "10px 0", flexShrink: 0, background: "rgba(0,0,0,.26)",
        }}>
          <button className="game-btn" onClick={() => { setSelected(null); setView("board"); }} style={{
            width: "100%", textAlign: "left", padding: "8px 12px", cursor: "pointer",
            background: !selected && view === "board" ? "rgba(255,199,44,.15)" : "transparent",
            border: `1px solid ${!selected && view === "board" ? T.gold : "transparent"}`,
            borderLeft: `3px solid ${!selected && view === "board" ? T.gold : "transparent"}`,
            borderRadius: 3, color: T.ink, marginBottom: 6,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15, fontWeight: 700, letterSpacing: 1.2,
          }}>📋 EDGE BOARD</button>
          <button className="game-btn" onClick={() => { setSelected(null); setView("report"); }} style={{
            width: "100%", textAlign: "left", padding: "8px 12px", cursor: "pointer",
            background: view === "report" && !selected ? "rgba(255,199,44,.15)" : "transparent",
            border: `1px solid ${view === "report" && !selected ? T.gold : "transparent"}`,
            borderLeft: `3px solid ${view === "report" && !selected ? T.gold : "transparent"}`,
            borderRadius: 3, color: T.ink, marginBottom: 6,
            fontFamily: "'Barlow Condensed',sans-serif", fontSize: 15, fontWeight: 700, letterSpacing: 1.2,
          }}>📊 REPORT CARD</button>
          <div style={{ padding: "0 12px 8px", fontSize: 9.5, color: T.inkFaint, letterSpacing: 1.4, fontWeight: 600 }}>
            {loading ? "LOADING…" : `${sched.games.length} GAMES`}
          </div>
          {error && <div style={{ padding: "12px", color: T.poor, fontSize: 11 }}>Error: {error}</div>}
          {sched.games.map((g) => {
            const sel = selected?.id === g.id;
            const d = new Date(g.date);
            const done = hasStarted(g);
            return (
              <button key={g.id} className="game-btn" onClick={() => { setSelected(g); setView("board"); }} style={{
                width: "100%", textAlign: "left",
                background: sel ? "rgba(255,199,44,.15)" : "transparent",
                border: `1px solid ${sel ? T.gold : "transparent"}`,
                borderLeft: `3px solid ${sel ? T.gold : "transparent"}`,
                borderRadius: 3, padding: "8px 12px", cursor: "pointer",
                color: T.ink, marginBottom: 1, fontFamily: "'Inter',sans-serif",
              }}>
                <div style={{
                  fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
                  opacity: done ? .55 : 1,
                }}>
                  {g.away.abbr} <span style={{ color: T.inkFaint, fontSize: 10.5, fontWeight: 400 }}>at</span> {g.home.abbr}
                  {g.state === "in" && <span style={{ width: 6, height: 6, borderRadius: "50%", background: T.gold }} />}
                  {done && g.state !== "in" && <span style={{ fontSize: 9, color: T.inkFaint }}>🔒</span>}
                </div>
                <div style={{ fontSize: 10, color: T.inkFaint, marginTop: 2 }}>
                  {done && g.state !== "in"
                    ? `FINAL ${g.away.score}–${g.home.score}`
                    : <>{d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
                       {" · "}{d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</>}
                </div>
              </button>
            );
          })}
          {!loading && sched.byes.length > 0 && (
            <div style={{ padding: "12px", borderTop: `1px solid ${T.chalkFaint}`, marginTop: 8 }}>
              <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: 1, marginBottom: 5 }}>ON BYE</div>
              <div style={{ fontSize: 11, color: T.inkDim, lineHeight: 1.6 }}>{sched.byes.join(" · ")}</div>
            </div>
          )}
        </div>

        <div className="gx-main" style={{ flex: 1, overflowY: "auto", padding: 18 }}>
          {!tables && (
            <div className="pulsing" style={{
              textAlign: "center", padding: 60, color: T.inkDim,
              fontFamily: "'Barlow Condensed',sans-serif", fontSize: 17, letterSpacing: 2.5,
            }}>
              BUILDING SEASON DATABASE…
              <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 11, letterSpacing: 0, marginTop: 10 }}>
                {dbProgress || "Aggregating box scores for real yards allowed"}
              </div>
            </div>
          )}
          {tables && !selected && view === "report" && (
            <ReportCard year={year} currentWeek={week} />
          )}
          {tables && !selected && view === "board" && (
            <Scanner scan={scan} scanning={scanning} progress={progress} league={league}
              week={week} onOpen={(g) => { setSelected(g); setView("board"); }}
              onRescan={() => doScan(true)} />
          )}
          {tables && selected && (
            <GameView key={selected.id} game={selected} league={league} tables={tables}
              year={year} posMean={scan?.posMean} env={env} onBack={() => setSelected(null)} />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
