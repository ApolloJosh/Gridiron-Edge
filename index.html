<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ==================================================================== *
 * Gridiron Edge — NFL matchup analysis · Apollo Media
 * Data: ESPN public APIs (no key). See docs/api-notes.md + docs/model.md.
 *
 * VERIFIED TRAPS — do not "fix" these back:
 *  - team.athletes (?enable=roster) is a FLAT array, not groups with .items
 *  - per-athlete stats are categories[].statistics[], each entry ONE SEASON
 *    whose .stats array is positionally parallel to the category .names
 *  - the BULK byathlete feed has a DIFFERENT shape: categories[].values
 *    parallel to a schema held at the RESPONSE level
 *  - core "defensive" yardsAllowed / pointsAllowed are 0 for all 32 teams
 *    while returning HTTP 200. Real yards allowed is computed here by
 *    aggregating box scores and inverting them (see buildSeasonDB)
 *  - the /teams list endpoint is NOT CORS-open; build the map from standings
 *  - weather has temperature + gust but NO windSpeed field
 *  - Week 1 fallback must test the MEDIAN team's games played, not the sum
 *  - interceptions means THROWN picks in `passing`, CAUGHT picks in
 *    `defensiveinterceptions` — always scope the category
 *  - the bulk feed reports the team a player played for THAT SEASON; current
 *    rosters must override it (157/684 differed at Week 1 2026)
 *  - ESPN serves odds for UPCOMING games only; 0 of 272 completed 2025 games
 *    retained a closing line, so the Vegas factor cannot be backtested
 *  - teamrankings.com is NOT CORS-open; a browser page can never fetch it
 * ==================================================================== */

const BUILD = "v11 · 2026-10-06";

const ESPN      = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const ESPN_V2   = "https://site.api.espn.com/apis/v2/sports/football/nfl";
const ESPN_WEB  = "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl";
const ESPN_CORE = "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl";
const BYATHLETE = `${ESPN_WEB}/statistics/byathlete`;

/* ---- MODEL CONSTANTS — every one measured, see docs/model.md ----
 * Opponent adjustment is applied as ratio^exponent.
 *   passing ^0.25  : best of the sweep, residual corr 0.141
 *   rushing ^0.10  : best of the sweep was ~0.1, i.e. almost off.
 *                    Full strength (^1.0) made MAE *worse*, 26.57 -> 27.04.
 * Carries blend 50/50 season+last3 beat season alone (4.197 vs 4.305).
 * Passing volume does NOT blend — last-3 was 7% worse for QBs.
 */
const PASS_OPP_EXP   = 0.25;
const RUSH_OPP_EXP   = 0.10;
const CARRY_RECENCY  = 0.50;
const OPP_RATIO_CLAMP = [0.80, 1.20];

/* ---- WEEK 1 2026 POST-MORTEM — see docs/week1-2026.md ----
 * Graded 188 real player-games, the first live out-of-sample test.
 *
 * 1. Top-quartile projections ran +12.8 yards HIGH. Elite prior-season
 *    baselines regress, and nothing in the model accounted for it. Shrinking
 *    each baseline toward the positional mean is the fix, validated BOTH
 *    ways before shipping: a within-2025 holdout (n = 371 QB / 1970 REC /
 *    889 RB) and Week 1 itself agree on direction — quarterbacks and
 *    receivers want shrinkage, running backs do not (best k = 1.00 in both).
 *
 * 2. The opponent term earns 15%, not 40%. That follows from the season
 *    backtest, where opponent adjustment carried almost no signal.
 *    CAUTION, and this corrects a first reading of the data: cutting it does
 *    NOT fix the apparent "EDGE is inverted" effect. Top-vs-bottom quartile
 *    spread on actual/baseline went -0.348 -> -0.243, but at ZERO opponent
 *    weight it is still -0.242, and corr(softness, act/base) is only -0.048.
 *    Most of that inversion is a ratio artifact: a 20-yard player can triple
 *    his average, a 100-yard player cannot. Judge the ranking by absolute
 *    production — corr(score, actual) = +0.242 — and by per-quartile bias,
 *    never by act/base.
 *
 * 3. 17% of projected players never recorded a line; backup QBs were being
 *    ranked as if they'd start. Depth charts now gate the board: 17.2% -> 9.0%.
 */
/* ---- WEEKS 2-3 2026 POST-MORTEM — see docs/week1-2026.md ----
 * The report card flagged a large, GROWING quarterback bias: -24.0 then -36.1
 * (negative = projecting too low). Decomposed against live results, n=28/29:
 *
 *   shipped (pool-mean shrink)      wk2 -24.0   wk3 -36.1
 *   no shrink                       wk2  -9.2   wk3 -22.6
 *   + league environment scalar     wk2  -5.9   wk3 -19.0
 *   + starts-only baseline          wk2  +1.2   wk3 -12.0
 *
 * Three separate causes, each fixed below:
 *
 * 1. SHRINKAGE TOWARD THE WRONG MEAN. The QB pool is 31 starters and 29
 *    backups, so its mean per-game is 174.9 — but the mean of the players we
 *    actually project is 218.6. Since v7 only projects starters, shrinking
 *    them toward a backup-contaminated mean was a pure downward push. The
 *    positional mean is now computed over the PROJECTED population.
 * 2. RELIEF APPEARANCES IN THE BASELINE. A quarterback's prior-season game
 *    log mixes starts with mop-up and injury-shortened outings. Averaging
 *    them understates what he does when he starts. QB baselines now use games
 *    with >= QB_START_ATT attempts (fallback to all if fewer than 3 qualify).
 *    This is QB-specific on purpose: for a committee back or a WR3, low-usage
 *    games ARE part of the distribution.
 * 3. LEAGUE ENVIRONMENT DRIFT. 2026 passing is up and rushing is down against
 *    2025. Projecting off last season without that correction is a standing
 *    bias. Scalars are measured from completed current-season games and
 *    clamped; env is computed from weeks BEFORE the projected one.
 */
const QB_START_ATT = 15;          // 20 tested marginally better; 15 keeps sample size
const ENV_CLAMP = [0.92, 1.08];

const SHRINK       = { QB: 0.90, REC: 0.85, RB: 1.00 }; // within-season, 2025-validated
const SHRINK_CROSS = { QB: 0.80, REC: 0.82, RB: 0.97 }; // projecting across an offseason
const POS_MEAN_FALLBACK = { QB: 208, REC: 34, RB: 37 }; // 2025 per-game means, recomputed at scan time
const EDGE_W_PLAYER = 0.85;   // was 0.60
const EDGE_W_OPP    = 0.15;   // was 0.40 — measured harmful in Week 1
/* Depth ranks allowed on the board. Charts can lag, so this is a default-on
   filter rather than a hard exclusion — the toggle turns it off. */
const DEPTH_LIMIT = { QB: 1, RB: 3, WR: 4, TE: 2 };

const T = {
  turf: "#14512f", turfDark: "#0e3b22", turfDeep: "#0a2d1a", turfLight: "#1a6139",
  chalk: "#ffffff", chalkDim: "rgba(255,255,255,.38)", chalkFaint: "rgba(255,255,255,.14)",
  gold: "#ffc72c", goldDeep: "#e0a413",
  leather: "#6b3410", leatherDark: "#43200a", leatherMid: "#8b4a1c",
  ink: "#f2f7f3", inkDim: "#b6cdbd", inkFaint: "#7fa38c",
  good: "#b9e6a1", bad: "#ffab91", poor: "#ff6b5e",
};
const SHADOW = `0 2px 0 ${T.leatherDark}, 0 6px 16px rgba(0,0,0,.38)`;
const SHADOW_SM = `0 2px 0 ${T.leatherDark}`;

const DIVISION = {
  BUF:"AFC East", MIA:"AFC East", NE:"AFC East", NYJ:"AFC East",
  BAL:"AFC North", CIN:"AFC North", CLE:"AFC North", PIT:"AFC North",
  HOU:"AFC South", IND:"AFC South", JAX:"AFC South", TEN:"AFC South",
  DEN:"AFC West", KC:"AFC West", LV:"AFC West", LAC:"AFC West",
  DAL:"NFC East", NYG:"NFC East", PHI:"NFC East", WSH:"NFC East",
  CHI:"NFC North", DET:"NFC North", GB:"NFC North", MIN:"NFC North",
  ATL:"NFC South", CAR:"NFC South", NO:"NFC South", TB:"NFC South",
  ARI:"NFC West", LAR:"NFC West", SEA:"NFC West", SF:"NFC West",
};
const OFF_POS = ["QB", "RB", "FB", "WR", "TE"];
const DEF_POS = ["DE", "DT", "NT", "LB", "OLB", "ILB", "MLB", "CB", "S", "FS", "SS", "DB", "EDGE"];

/* ------------------------------ plumbing ------------------------------ */

const CACHE_TTL_MS = 5 * 60 * 1000;
const _cache = new Map();
function clearCache() { _cache.clear(); }
async function fetchJSON(url) {
  const hit = _cache.get(url);
  if (hit && Date.now() - hit.at < CACHE_TTL_MS) return hit.p;
  const p = (async () => {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })();
  _cache.set(url, { p, at: Date.now() });
  p.catch(() => _cache.delete(url));
  return p;
}
async function safeJSON(url) { try { return await fetchJSON(url); } catch { return null; } }

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

function num(v) {
  if (v === null || v === undefined || v === "-") return NaN;
  const n = parseFloat(String(v).replace(/,/g, ""));
  return isNaN(n) ? NaN : n;
}
const fmt = (v, d = 1) => (isNaN(num(v)) ? "—" : num(v).toFixed(d));
const int = (v) => (isNaN(num(v)) ? "—" : String(Math.round(num(v))));
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function quantile(sorted, f) {
  if (!sorted.length) return NaN;
  const i = clamp(Math.floor(f * sorted.length), 0, sorted.length - 1);
  return sorted[i];
}
function ordinal(n) {
  if (!n || isNaN(n)) return "—";
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* local storage is best-effort; a file:// origin may refuse it entirely */
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  keys(prefix) {
    try {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) out.push(k);
      }
      return out;
    } catch { return []; }
  },
};

/** Which weeks actually have a pre-kickoff projection snapshot on this device.
 *  The report card enumerates from storage rather than counting up to the
 *  current week: ESPN's unparameterized scoreboard flips its week marker on its
 *  own schedule, and a strictly-less-than bound against it silently hid the
 *  week that had just finished. */
function snapshotWeeks(year) {
  const pre = `gx_proj_${year}_`;
  return store.keys(pre)
    .map((k) => +k.slice(pre.length))
    .filter((w) => isFinite(w) && w > 0)
    .sort((a, b) => a - b);
}

/* ------------------------------ grading ------------------------------ */

function grade(val, thresholds, higherIsBetter = true) {
  const v = num(val);
  if (isNaN(v)) return null;
  const [elite, good, avg, bad] = thresholds;
  if (higherIsBetter) {
    if (v >= elite) return "elite";
    if (v >= good) return "good";
    if (v >= avg) return "avg";
    if (v >= bad) return "bad";
    return "poor";
  }
  if (v <= elite) return "elite";
  if (v <= good) return "good";
  if (v <= avg) return "avg";
  if (v <= bad) return "bad";
  return "poor";
}
const GRADE_COLOR = { elite: T.gold, good: T.good, avg: T.chalk, bad: T.bad, poor: T.poor };
const gradeColor = (g) => (g ? GRADE_COLOR[g] : T.inkFaint);
const GRADE_SCORE = { elite: 1, good: 0.75, avg: 0.5, bad: 0.25, poor: 0 };

function statOf(stats, categories, candidates) {
  if (!stats) return undefined;
  const lower = {};
  Object.keys(stats).forEach((k) => { lower[k.toLowerCase()] = stats[k]; });
  for (const cat of categories) {
    const block = lower[cat.toLowerCase()];
    if (!block) continue;
    for (const key of candidates) {
      if (block[key] !== undefined && block[key] !== null && block[key] !== "") return block[key];
    }
  }
  return undefined;
}
const DEF_CATS = ["defensive", "defensiveinterceptions", "general"];
const defStat = (s, candidates) => statOf(s, DEF_CATS, candidates);

/* --------------------------- schedule + odds --------------------------- */

async function getSchedule(year, week, seasonType) {
  const d = await fetchJSON(`${ESPN}/scoreboard?seasontype=${seasonType}&week=${week}&dates=${year}`);
  const games = (d.events || []).map((ev) => {
    const comp = ev.competitions?.[0] || {};
    const home = (comp.competitors || []).find((c) => c.homeAway === "home") || {};
    const away = (comp.competitors || []).find((c) => c.homeAway === "away") || {};
    const side = (c) => ({
      id: c.team?.id, abbr: c.team?.abbreviation, name: c.team?.displayName,
      score: c.score, record: (c.records || [])[0]?.summary,
    });
    const o = (comp.odds || [])[0];
    return {
      id: ev.id, name: ev.shortName || ev.name, date: ev.date,
      status: comp.status?.type?.description, state: comp.status?.type?.state,
      completed: comp.status?.type?.completed,
      venue: comp.venue?.fullName, indoor: comp.venue?.indoor,
      home: side(home), away: side(away),
      odds: o ? {
        spread: num(o.spread), total: num(o.overUnder),
        homeFav: o.homeTeamOdds?.favorite === true,
        provider: o.provider?.name,
      } : null,
    };
  });
  games.sort((a, b) => new Date(a.date) - new Date(b.date));
  return { games, byes: (d.week?.teamsOnBye || []).map((t) => t.abbreviation) };
}

/** Implied team totals from the closing line. total/2 ± half the spread. */
function impliedTotals(game) {
  const o = game?.odds;
  if (!o || isNaN(o.total) || isNaN(o.spread)) return null;
  const half = Math.abs(o.spread) / 2;
  const home = o.total / 2 + (o.homeFav ? half : -half);
  return { home, away: o.total - home, total: o.total, spread: o.spread, provider: o.provider };
}

/**
 * Three independent signals — an earlier build trusted `state` alone, which
 * fails open if the field is ever missing.
 */
function hasStarted(g) {
  if (!g) return false;
  if (g.state === "post" || g.state === "in") return true;
  if (g.completed === true) return true;
  const t = new Date(g.date).getTime();
  return !isNaN(t) && t <= Date.now();
}

/* ====================== SEASON DATABASE ======================
 * ESPN exposes no opponent split and its yardsAllowed field is a phantom
 * zero, so real yards allowed is built by pulling every box score and
 * inverting it: what a team's opponents gained IS what it allowed.
 * 272 games ~ 6 seconds, then cached.
 * ============================================================ */

async function buildSeasonDB(season, onProgress, liveKeySuffix) {
  /* A finished season is immutable and caches forever. An in-progress one
     gains games every week, so its key carries a suffix that changes. */
  const key = `gx_db_${season}_v5${liveKeySuffix ? "_" + liveKeySuffix : ""}`;
  const cached = store.get(key);
  if (cached?.rows?.length) return cached;

  onProgress?.("Finding completed games…");
  const weeks = Array.from({ length: 18 }, (_, i) => i + 1);
  const boards = await pool(weeks, 6, (w) =>
    safeJSON(`${ESPN}/scoreboard?seasontype=2&week=${w}&dates=${season}`));

  const events = [];
  boards.forEach((b, i) => {
    (b?.events || []).forEach((e) => {
      const c = e.competitions?.[0];
      if (c?.status?.type?.state !== "post") return;
      events.push({ id: e.id, week: i + 1 });
    });
  });
  if (!events.length) return null;

  onProgress?.(`Reading ${events.length} box scores…`);
  const sums = await pool(events.map((e) => e.id), 8, (id) => safeJSON(`${ESPN}/summary?event=${id}`));

  const rows = [];
  sums.forEach((s, i) => {
    const bt = s?.boxscore?.teams;
    if (!bt || bt.length !== 2) return;
    const comps = s?.header?.competitions?.[0]?.competitors || [];
    const score = {};
    comps.forEach((c) => { score[c.team?.abbreviation] = num(c.score); });
    const g = (t, n) => {
      const x = (t.statistics || []).find((y) => y.name === n);
      return x ? x.displayValue : null;
    };
    const abbr = bt.map((t) => t.team?.abbreviation);
    bt.forEach((t, k) => {
      const me = abbr[k], op = abbr[1 - k];
      const ca = (g(t, "completionAttempts") || "0/0").split("/");
      rows.push({
        w: events[i].week, team: me, opp: op,
        plays: num(g(t, "totalOffensivePlays")), totYds: num(g(t, "totalYards")),
        rushYds: num(g(t, "rushingYards")), rushAtt: num(g(t, "rushingAttempts")),
        passYds: num(g(t, "netPassingYards")), passAtt: num(ca[1]),
        pts: score[me], ptsAg: score[op],
      });
    });
  });

  const db = { season, rows, builtAt: Date.now(), games: events.length };
  store.set(key, db);
  return db;
}

/**
 * League scoring environment: current season vs the season we project from.
 * Returns multipliers for passing and rushing, clamped, 1.0 when we're already
 * projecting from the current year or there isn't a usable sample yet.
 */
function leagueEnv(currentDb, priorTables) {
  const blank = { pass: 1, rush: 1, n: 0 };
  if (!currentDb?.rows?.length || !priorTables?.league) return blank;
  const rows = currentDb.rows;
  if (rows.length < 24) return blank;           // under ~12 games, too noisy
  const pass = mean(rows.map((r) => r.passYds || 0));
  const rush = mean(rows.map((r) => r.rushYds || 0));
  return {
    pass: clamp(pass / priorTables.league.passYdsPg, ...ENV_CLAMP),
    rush: clamp(rush / priorTables.league.rushYdsPg, ...ENV_CLAMP),
    n: rows.length,
  };
}

/**
 * Turn the per-game rows into league tables.
 * A team's DEFENSE is every row where it appears as the opponent.
 */
function leagueTables(db) {
  if (!db?.rows?.length) return null;
  const off = {}, def = {};
  const bump = (m, k) => (m[k] = m[k] || { g: 0, plays: 0, rushYds: 0, rushAtt: 0, passYds: 0, passAtt: 0, pts: 0 });
  db.rows.forEach((r) => {
    const o = bump(off, r.team);
    o.g++; o.plays += r.plays || 0; o.rushYds += r.rushYds || 0; o.rushAtt += r.rushAtt || 0;
    o.passYds += r.passYds || 0; o.passAtt += r.passAtt || 0; o.pts += r.pts || 0;
    const d = bump(def, r.opp);
    d.g++; d.plays += r.plays || 0; d.rushYds += r.rushYds || 0; d.rushAtt += r.rushAtt || 0;
    d.passYds += r.passYds || 0; d.passAtt += r.passAtt || 0; d.pts += r.pts || 0;
  });

  const teams = Object.keys(def);
  const D = {}, O = {};
  teams.forEach((t) => {
    const d = def[t], o = off[t] || d;
    D[t] = {
      rushYdsPg: d.rushYds / d.g, rushAttPg: d.rushAtt / d.g,
      ypcAllowed: d.rushAtt ? d.rushYds / d.rushAtt : NaN,
      passYdsPg: d.passYds / d.g, passAttPg: d.passAtt / d.g,
      ypaAllowed: d.passAtt ? d.passYds / d.passAtt : NaN,
      playsPgFaced: d.plays / d.g, ptsPg: d.pts / d.g, g: d.g,
    };
    O[t] = {
      playsPg: o.plays / o.g, rushAttPg: o.rushAtt / o.g, passAttPg: o.passAtt / o.g,
      ptsPg: o.pts / o.g, ypp: o.plays ? o.totYds / o.plays : NaN, g: o.g,
    };
  });

  const all = db.rows;
  const league = {
    ypc: all.reduce((a, r) => a + (r.rushYds || 0), 0) / all.reduce((a, r) => a + (r.rushAtt || 0), 0),
    rushYdsPg: mean(all.map((r) => r.rushYds || 0)),
    passYdsPg: mean(all.map((r) => r.passYds || 0)),
    playsPg: mean(all.map((r) => r.plays || 0)),
    ptsPg: mean(all.map((r) => r.pts || 0)),
  };

  const rankBy = (obj, field, lowIsBetter) => {
    const rows = teams.map((t) => ({ t, v: obj[t][field] })).filter((x) => !isNaN(x.v));
    rows.sort((a, b) => (lowIsBetter ? a.v - b.v : b.v - a.v));
    const m = {};
    rows.forEach((x, i) => { m[x.t] = i + 1; });
    return m;
  };
  const ranks = {
    rushYds: rankBy(D, "rushYdsPg", true), ypc: rankBy(D, "ypcAllowed", true),
    passYds: rankBy(D, "passYdsPg", true), pts: rankBy(D, "ptsPg", true),
    playsFaced: rankBy(D, "playsPgFaced", true),
    offPlays: rankBy(O, "playsPg", false), offPts: rankBy(O, "ptsPg", false),
  };
  teams.forEach((t) => {
    D[t].rankRushYds = ranks.rushYds[t]; D[t].rankYpc = ranks.ypc[t];
    D[t].rankPassYds = ranks.passYds[t]; D[t].rankPts = ranks.pts[t];
    D[t].rankPlaysFaced = ranks.playsFaced[t];
    O[t].rankPlays = ranks.offPlays[t]; O[t].rankPts = ranks.offPts[t];
  });
  return { defense: D, offense: O, league, teams: teams.length, season: db.season };
}

/* --------------------------- player sources --------------------------- */

async function getRoster(teamId) {
  const d = await safeJSON(`${ESPN}/teams/${teamId}?enable=roster`);
  const athletes = d?.team?.athletes || [];   // FLAT array
  return athletes.map((a) => ({
    id: a.id, name: a.displayName, jersey: a.jersey, pos: a.position?.abbreviation,
  })).filter((a) => a.id && a.pos);
}

/**
 * Season stats for one athlete, PINNED to a season.
 *
 * This used to take "the latest season with any data", which quietly broke
 * the matchup view once the new year started: a quarterback who had played
 * week 1 resolved to a 29-attempt 2026 sample while his backup resolved to a
 * full 66-attempt 2025 season — different players measured over different
 * spans, compared against each other and fed to the same model. Pin the
 * season, and fall back only to the most recent EARLIER season.
 */
async function getAthleteSeason(playerId, season) {
  const d = await safeJSON(`${ESPN_WEB}/athletes/${playerId}/stats`);
  if (!d?.categories) return null;
  const pick = (seasons) => {
    let exact = null, earlier = null;
    for (const s of seasons) {
      const y = s?.season?.year;
      if (y == null) continue;
      if (season != null && y === season) exact = s;
      else if (season == null || y < season) {
        if (!earlier || y > earlier.season.year) earlier = s;
      }
    }
    return exact || earlier;
  };
  const out = { season: null };
  for (const cat of d.categories) {
    const names = cat.names || [], seasons = cat.statistics || [];
    if (!names.length || !seasons.length) continue;
    const chosen = pick(seasons);
    if (!chosen) continue;
    const vals = {};
    names.forEach((n, i) => { vals[n] = chosen.stats?.[i]; });
    out[cat.name] = vals;
    if (!out.season || chosen.season.year > out.season) out.season = chosen.season.year;
  }
  return out.season ? out : null;
}

async function getBulkAthletes(season, sort, limit) {
  const url = `${BYATHLETE}?region=us&lang=en&contentorigin=espn&isqualified=false`
    + `&season=${season}&seasontype=2&page=1&limit=${limit}&sort=${encodeURIComponent(sort)}`;
  const d = await safeJSON(url);
  if (!d?.athletes) return [];
  const schema = {};
  (d.categories || []).forEach((c) => { schema[c.name] = c.names || []; });
  return d.athletes.map((a) => {
    const stats = { season };
    (a.categories || []).forEach((c) => {
      const names = schema[c.name] || c.names || [];
      const vals = c.values || [];
      const blk = {};
      names.forEach((n, i) => { blk[n] = vals[i]; });
      stats[c.name] = blk;
    });
    return {
      id: a.athlete?.id, name: a.athlete?.displayName, jersey: a.athlete?.jersey,
      pos: a.athlete?.position?.abbreviation, team: a.athlete?.teamShortName, stats,
    };
  }).filter((p) => p.id && p.team && p.pos);
}

/**
 * Offensive depth chart. The core feed returns three charts per team; the
 * offensive one is whichever carries a `qb` position group (its name varies:
 * "3WR 1TE", "2WR 2TE", …). Returns athleteId -> depth rank.
 *
 * Week 1 2026 is why this exists: Atlanta's board entry was Tua Tagovailoa,
 * who is QB2 behind Michael Penix Jr. Backup QBs were being projected for
 * 250 yards.
 */
async function getDepthChart(teamId, season) {
  const d = await safeJSON(`${ESPN_CORE}/seasons/${season}/teams/${teamId}/depthcharts`);
  const charts = d?.items || [];
  const offense = charts.find((c) => c?.positions && (c.positions.qb || c.positions.rb));
  if (!offense) return { ranks: {}, qb: [] };
  const ranks = {};
  const idsOf = (grp) => (grp?.athletes || []).map((a) => ({
    rank: a.rank, id: String(a.athlete?.$ref || "").match(/athletes\/(\d+)/)?.[1],
  })).filter((x) => x.id).sort((a, b) => a.rank - b.rank);
  Object.values(offense.positions).forEach((grp) => {
    idsOf(grp).forEach(({ id, rank }) => {
      if (ranks[id] === undefined || rank < ranks[id]) ranks[id] = rank;
    });
  });
  return { ranks, qb: idsOf(offense.positions.qb) };
}

/* ====================== STARTING QUARTERBACK ======================
 * QB is not like the other positions. A backup running back gets carries;
 * a backup quarterback gets nothing unless the starter goes down, so ranking
 * QB2 at all is simply wrong — a projection of 100 yards for a man who will
 * not take a snap.
 *
 * Resolution, in order:
 *   1. the depth chart's QB order (ESPN's current statement of who starts)
 *   2. drop anyone Out / Doubtful / IR / suspended on THIS GAME's report
 *   3. highest surviving rank is the starter
 *   4. no usable chart -> whoever leads the team in attempts this season
 *
 * Validated across all 32 teams in Week 2 2026: every team resolved to
 * exactly one QB; Seattle correctly promoted Drew Lock with Sam Darnold Out.
 * Where the chart and actual usage disagree with no injury to explain it
 * (Atlanta, Minnesota), the pick is FLAGGED rather than silently made —
 * those are real quarterback controversies and the user should look.
 *
 * Note the per-athlete injuries endpoint is useless here: it returns zero
 * items for every quarterback checked. The game summary's injury block is
 * the only feed that actually carries "Out".
 */
const QB_OUT_RE = /^(out|doubtful|injured reserve|ir\b|suspend|physically unable|did not)/i;

/** team -> { id, att } for whoever is throwing the ball this season. */
async function getQbUsage(season) {
  const url = `${BYATHLETE}?region=us&lang=en&contentorigin=espn&isqualified=false`
    + `&season=${season}&seasontype=2&page=1&limit=80&sort=${encodeURIComponent("passing.passingAttempts:desc")}`;
  const d = await safeJSON(url);
  if (!d?.athletes) return {};
  const schema = {};
  (d.categories || []).forEach((c) => { schema[c.name] = c.names || []; });
  const out = {};
  d.athletes.forEach((a) => {
    if (a.athlete?.position?.abbreviation !== "QB") return;
    const team = a.athlete?.teamShortName;
    if (!team) return;
    const cat = (a.categories || []).find((c) => c.name === "passing");
    const names = schema.passing || [];
    const att = num((cat?.values || [])[names.indexOf("passingAttempts")]);
    if (!(att > 0)) return;
    if (!out[team] || att > out[team].att) {
      out[team] = { id: String(a.athlete.id), att, name: a.athlete.displayName };
    }
  });
  return out;
}

function resolveStarterQB(teamAbbr, chartQbs, injuriesForTeam, usage) {
  const inj = injuriesForTeam || {};
  const statusOf = (id) => inj[String(id)] || "";
  const chart = chartQbs || [];
  const healthy = chart.filter((c) => !QB_OUT_RE.test(statusOf(c.id)));
  const use = usage?.[teamAbbr] || null;

  let pick = healthy[0] || null, via = "depth chart", promotedFrom = null;
  if (chart[0] && QB_OUT_RE.test(statusOf(chart[0].id)) && pick) {
    via = "depth chart + injury report";
    promotedFrom = { id: chart[0].id, status: statusOf(chart[0].id) };
  }
  if (!pick && use) { pick = { id: use.id, rank: 1 }; via = "season usage"; }
  if (!pick) return null;

  const conflict = use && !promotedFrom && String(use.id) !== String(pick.id)
    ? { id: use.id, name: use.name, att: use.att } : null;
  return { id: String(pick.id), via, promotedFrom, conflict };
}

/** Per-game log: recency, variance, and past meetings with this opponent. */
async function getGameLog(playerId, season) {
  const d = await safeJSON(`${ESPN_WEB}/athletes/${playerId}/gamelog?season=${season}`);
  if (!d?.names || !d?.events) return null;
  const byId = {};
  (d.seasonTypes || []).forEach((st) => (st.categories || []).forEach((c) =>
    (c.events || []).forEach((e) => { byId[e.eventId] = e.stats; })));
  const games = [];
  Object.entries(d.events).forEach(([eid, meta]) => {
    const s = byId[eid];
    if (!s) return;
    const o = {};
    d.names.forEach((n, i) => { if (o[n] === undefined) o[n] = num(s[i]); });
    games.push({ week: meta.week, opp: meta.opponent?.abbreviation, home: meta.atVs === "vs", stats: o });
  });
  games.sort((a, b) => a.week - b.week);
  return games.length ? games : null;
}

/* --------------------------- game detail --------------------------- */

async function getGameDetail(eventId) {
  const d = await safeJSON(`${ESPN}/summary?event=${eventId}`);
  if (!d) return null;
  const w = d.gameInfo?.weather || null;
  const injuries = {}, injuriesById = {};
  (Array.isArray(d.injuries) ? d.injuries : []).forEach((block) => {
    const ab = block.team?.abbreviation;
    if (!ab) return;
    injuries[ab] = (block.injuries || []).map((x) => ({
      name: x.athlete?.displayName, pos: x.athlete?.position?.abbreviation, status: x.status,
    }));
    injuriesById[ab] = {};
    (block.injuries || []).forEach((x) => {
      if (x.athlete?.id) injuriesById[ab][String(x.athlete.id)] = x.status;
    });
  });
  return {
    weather: w ? { temp: w.temperature ?? w.highTemperature, gust: w.gust } : null,
    indoor: d.gameInfo?.venue?.indoor,
    injuries, injuriesById,
  };
}

/* ====================== PROJECTION ENGINE ====================== */

function weatherFactor(wx, indoor, phase) {
  if (indoor) return { key: "wx", label: "Indoor — no weather effect", mult: 1, active: true };
  const temp = num(wx?.temp), gust = num(wx?.gust);
  if (isNaN(temp) && isNaN(gust)) {
    return { key: "wx", label: "Weather unavailable", mult: 1, active: false, pending: true };
  }
  let mult = 1;
  const notes = [];
  if (!isNaN(gust) && gust >= 20) { mult *= phase === "pass" ? 0.92 : 1.04; notes.push(`gusts ${Math.round(gust)}mph`); }
  else if (!isNaN(gust) && gust >= 15) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`gusts ${Math.round(gust)}mph`); }
  if (!isNaN(temp) && temp < 25) { mult *= phase === "pass" ? 0.96 : 1.02; notes.push(`${Math.round(temp)}°F`); }
  else if (!isNaN(temp) && temp < 35) { mult *= phase === "pass" ? 0.98 : 1.01; notes.push(`${Math.round(temp)}°F`); }
  return {
    key: "wx",
    label: notes.length ? `Weather: ${notes.join(", ")}` : `Weather neutral${isNaN(temp) ? "" : ` (${Math.round(temp)}°F)`}`,
    mult, active: true,
  };
}

function archetypeOf(pos, per) {
  if (pos === "QB") {
    if (per.rushYdsPg >= 30) return "Dual threat";
    if (per.ypa >= 8.2) return "Downfield passer";
    return "Pocket passer";
  }
  if (pos === "RB" || pos === "FB") {
    if (per.recPg >= 3.5) return "Receiving back";
    if (per.carPg >= 15 && per.ypc < 4.2) return "Bruiser";
    if (per.ypc >= 4.8) return "Explosive back";
    return "Rotational back";
  }
  if (pos === "TE") return per.tgtPg >= 6 ? "Move TE" : "In-line TE";
  if (per.ypr >= 15) return "Deep threat";
  if (per.tgtPg >= 8) return "Volume WR1";
  if (per.ypr > 0 && per.ypr < 11) return "Possession WR";
  return "Rotational WR";
}

const KIND_OF_POS = (pos) =>
  pos === "QB" ? "QB"
  : ["WR", "TE"].includes(pos) ? "REC"
  : ["RB", "FB"].includes(pos) ? "RB"
  : DEF_POS.includes(pos) ? "DEF" : null;

/**
 * Pull an extreme baseline toward the positional mean. An elite prior season
 * is partly real and partly the high end of a noisy sample; shrinkage keeps
 * the real part. Strength per position is measured, not assumed — running
 * backs tested best at 1.00 (no shrinkage) in both the 2025 holdout and Week 1.
 */
function shrinkBaseline(base, kind, ctx) {
  if (isNaN(base)) return base;
  const pm = ctx?.posMean?.[kind] || POS_MEAN_FALLBACK[kind];
  if (!pm) return base;
  const table = ctx?.crossSeason ? SHRINK_CROSS : SHRINK;
  const k = table[kind] !== undefined ? table[kind] : 1;
  return pm + (base - pm) * k;
}

/** Distribution from the game log — the part the backtest said to trust. */
function distribution(values) {
  const v = values.filter((x) => !isNaN(x));
  if (v.length < 3) return null;
  const s = [...v].sort((a, b) => a - b);
  const m = mean(v);
  const sd = Math.sqrt(mean(v.map((x) => (x - m) * (x - m))));
  return {
    n: v.length, mean: m, median: quantile(s, 0.5),
    p25: quantile(s, 0.25), p75: quantile(s, 0.75),
    min: s[0], max: s[s.length - 1], sd, cv: m > 0 ? sd / m : NaN,
    values: v,
  };
}

/**
 * THE shared analysis — scanner and matchup cards both call it.
 * ctx: { defAbbr, defRow, offRow, league, teams, wx, indoor, implied, log, oppHistory }
 */
function analyze(p, kind, ctx) {
  const s = p.stats || {};
  const passing = s.passing || {}, rushing = s.rushing || {}, receiving = s.receiving || {};
  const gpAny = num(statOf(s, ["general", "passing", "rushing", "receiving", "defensive"], ["gamesPlayed", "teamGamesPlayed"]));
  const G = gpAny && gpAny > 0 ? gpAny : NaN;
  const log = ctx.log || null;
  const D = ctx.defRow, L = ctx.league;

  /* opponent ratio: >1 means the defense gives this up more than league average */
  const passRatio = D && L && !isNaN(D.passYdsPg) ? clamp(D.passYdsPg / L.passYdsPg, ...OPP_RATIO_CLAMP) : 1;
  const rushRatio = D && L && !isNaN(D.rushYdsPg) ? clamp(D.rushYdsPg / L.rushYdsPg, ...OPP_RATIO_CLAMP) : 1;
  const passMult = Math.pow(passRatio, PASS_OPP_EXP);
  const rushMult = Math.pow(rushRatio, RUSH_OPP_EXP);

  let per = {}, seasonCells = [], grades = [], phase = "pass", volume = 0;
  let headline = null, projected = {}, projLabels = [], dist = null, factors = [];

  const logVals = (key) => (log ? log.map((g) => g.stats[key]).filter((x) => !isNaN(x)) : []);
  const lastN = (arr, n) => arr.slice(-n);

  if (kind === "QB") {
    phase = "pass";
    const att = num(passing.passingAttempts), yds = num(passing.passingYards),
          td = num(passing.passingTouchdowns), ints = num(passing.interceptions),
          rtg = num(passing.QBRating), ypa = num(passing.yardsPerPassAttempt),
          cmp = num(passing.completionPct), rush = num(rushing.rushingYards);
    volume = att;
    per = { ypg: yds / G, tdPg: td / G, ypa, rushYdsPg: rush / G };
    const tdPct = att ? (td / att) * 100 : NaN, intPct = att ? (ints / att) * 100 : NaN;
    const g1 = grade(yds / G, [285, 250, 215, 180]), g2 = grade(rtg, [100, 90, 80, 70]),
          g3 = grade(ypa, [8.2, 7.4, 6.7, 6.0]), g4 = grade(cmp, [68, 64, 60, 56]),
          g5 = grade(tdPct, [6, 4.8, 3.8, 2.8]), g6 = grade(intPct, [1.4, 2, 2.6, 3.2], false);
    grades = [g1, g2, g3, g4, g5, g6];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 }, { label: "RTG", value: fmt(rtg), g: g2 },
      { label: "YPA", value: fmt(ypa), g: g3 },
      { label: "CMP%", value: isNaN(cmp) ? "—" : fmt(cmp) + "%", g: g4 },
      { label: "TD%", value: isNaN(tdPct) ? "—" : tdPct.toFixed(1) + "%", g: g5 },
      { label: "INT%", value: isNaN(intPct) ? "—" : intPct.toFixed(1) + "%", g: g6 },
      { label: "TD/G", value: fmt(td / G) }, { label: "RUSH/G", value: fmt(rush / G) },
    ];
    /* Passing does NOT blend to recency — last-3 was 7% worse in the backtest.
       But it DOES exclude relief appearances: averaging mop-up duty into a
       starter's baseline understates him by ~10 yards a game (measured). */
    const startGames = log
      ? log.filter((g) => num(g.stats.passingAttempts) >= QB_START_ATT)
      : [];
    const startVals = startGames.map((g) => num(g.stats.passingYards)).filter((x) => !isNaN(x));
    const allVals = logVals("passingYards");
    const rawBase = startVals.length >= 3 ? mean(startVals)
      : (log && allVals.length ? mean(allVals) : yds / G);
    const base = shrinkBaseline(rawBase, "QB", ctx) * (ctx.env?.pass || 1);
    const startsUsed = startVals.length >= 3 ? startVals.length : null;
    const attPool = startGames.length >= 3
      ? startGames.map((g) => num(g.stats.passingAttempts)).filter((x) => !isNaN(x))
      : (log ? log.map((g) => num(g.stats.passingAttempts)).filter((x) => !isNaN(x)) : []);
    var baselineAtt = attPool.length ? mean(attPool) : (att / G);
    dist = distribution(startVals.length >= 3 ? startVals : logVals("passingYards"));
    projected = { passYds: base * passMult, passTd: (td / G) * passMult, ints: ints / G, rushYds: rush / G };
    projLabels = [
      { key: "passYds", label: "PASS YDS", d: 1, headline: true, logKey: "passingYards" },
      { key: "passTd", label: "PASS TD", d: 2 }, { key: "ints", label: "INT", d: 2 },
      { key: "rushYds", label: "RUSH YDS", d: 1 },
    ];
    factors = [
      { key: "def", label: `${ctx.defAbbr} allows ${fmt(D?.passYdsPg)} pass yds/g (${ordinal(D?.rankPassYds)})`,
        mult: passMult, active: !!D, note: `ratio^${PASS_OPP_EXP}` },
    ];
    if (startsUsed) factors.push({ key: "starts", label: `${startsUsed} starts only (relief games excluded)`,
      mult: 1, active: true, note: "baseline population" });
  } else if (kind === "REC") {
    phase = "pass";
    const rec = num(receiving.receptions), yds = num(receiving.receivingYards),
          tgt = num(receiving.receivingTargets), td = num(receiving.receivingTouchdowns),
          ypr = num(receiving.yardsPerReception);
    volume = tgt;
    per = { ypr, tgtPg: tgt / G, recPg: rec / G };
    const g1 = grade(yds / G, [80, 60, 42, 28]), g2 = grade(tgt / G, [8.5, 6.5, 4.5, 3]),
          g3 = grade(ypr, [15, 12.5, 10.5, 8.5]), g4 = grade(rec / G, [6, 4.5, 3, 2]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 }, { label: "TGT/G", value: fmt(tgt / G), g: g2 },
      { label: "REC/G", value: fmt(rec / G), g: g4 }, { label: "YPR", value: fmt(ypr), g: g3 },
      { label: "TD", value: int(td) }, { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    const base = shrinkBaseline(log ? mean(logVals("receivingYards")) : yds / G, "REC", ctx) * (ctx.env?.pass || 1);
    dist = distribution(logVals("receivingYards"));
    projected = { recYds: base * passMult, rec: (rec / G) * passMult, tgt: tgt / G, td: (td / G) * passMult };
    projLabels = [
      { key: "recYds", label: "REC YDS", d: 1, headline: true, logKey: "receivingYards" },
      { key: "rec", label: "REC", d: 1 }, { key: "tgt", label: "TGT", d: 1 }, { key: "td", label: "TD", d: 2 },
    ];
    factors = [
      { key: "def", label: `${ctx.defAbbr} allows ${fmt(D?.passYdsPg)} pass yds/g (${ordinal(D?.rankPassYds)})`,
        mult: passMult, active: !!D, note: `ratio^${PASS_OPP_EXP}` },
    ];
  } else if (kind === "RB") {
    phase = "rush";
    const car = num(rushing.rushingAttempts), yds = num(rushing.rushingYards),
          ypc = num(rushing.yardsPerRushAttempt), td = num(rushing.rushingTouchdowns),
          rec = num(receiving.receptions), recYds = num(receiving.receivingYards);
    volume = car;
    per = { carPg: car / G, ypc, recPg: rec / G };
    const g1 = grade(yds / G, [90, 70, 50, 32]), g2 = grade(car / G, [18, 14, 10, 6]),
          g3 = grade(ypc, [5, 4.5, 4.1, 3.7]), g4 = grade(rec / G, [4, 2.5, 1.5, .8]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "YDS/G", value: fmt(yds / G), g: g1 }, { label: "CAR/G", value: fmt(car / G), g: g2 },
      { label: "YPC", value: fmt(ypc), g: g3 }, { label: "REC/G", value: fmt(rec / G), g: g4 },
      { label: "TD", value: int(td) }, { label: "YDS", value: int(yds), sub: isNaN(G) ? "" : `${int(G)}g` },
    ];
    /* carries DO blend to recency — 50/50 beat season alone (4.197 vs 4.305) */
    const carAll = logVals("rushingAttempts");
    const carSeason = carAll.length ? mean(carAll) : car / G;
    const carRecent = carAll.length >= 3 ? mean(lastN(carAll, 3)) : carSeason;
    const projCar = CARRY_RECENCY * carRecent + (1 - CARRY_RECENCY) * carSeason;
    const base = shrinkBaseline(log ? mean(logVals("rushingYards")) : yds / G, "RB", ctx) * (ctx.env?.rush || 1);
    dist = distribution(logVals("rushingYards"));
    projected = {
      rushYds: base * rushMult, car: projCar, td: (td / G) * rushMult, recYds: recYds / G,
    };
    projLabels = [
      { key: "rushYds", label: "RUSH YDS", d: 1, headline: true, logKey: "rushingYards" },
      { key: "car", label: "CARRIES", d: 1, logKey: "rushingAttempts" },
      { key: "td", label: "RUSH TD", d: 2 }, { key: "recYds", label: "REC YDS", d: 1 },
    ];
    factors = [
      { key: "def", label: `${ctx.defAbbr} allows ${fmt(D?.rushYdsPg)} rush yds/g, ${fmt(D?.ypcAllowed, 2)} per carry (${ordinal(D?.rankRushYds)})`,
        mult: rushMult, active: !!D, note: `ratio^${RUSH_OPP_EXP} — measured near-zero signal` },
      { key: "car", label: `Carries blended 50/50 season + last 3`, mult: 1, active: true, note: "applied to volume, not yards" },
    ];
  } else {
    phase = "defense";
    const tkl = num(defStat(s, ["totalTackles", "tackles", "combinedTackles"])),
          sacks = num(defStat(s, ["sacks", "totalSacks"])),
          ints = num(defStat(s, ["interceptions", "totalInterceptions"])),
          pd = num(defStat(s, ["passesDefended", "passesBattedDown"])),
          tfl = num(defStat(s, ["tacklesForLoss"])), ff = num(defStat(s, ["fumblesForced", "defensiveFumblesForced"]));
    volume = tkl;
    const g1 = grade(tkl / G, [7, 5.5, 4, 2.5]), g2 = grade(sacks / G, [.7, .45, .25, .1]),
          g3 = grade(ints / G, [.3, .18, .09, .03]), g4 = grade(pd / G, [1, .6, .35, .15]);
    grades = [g1, g2, g3, g4];
    seasonCells = [
      { label: "TKL/G", value: fmt(tkl / G), g: g1 }, { label: "SACK/G", value: fmt(sacks / G, 2), g: g2 },
      { label: "INT/G", value: fmt(ints / G, 2), g: g3 }, { label: "PD/G", value: fmt(pd / G, 2), g: g4 },
      { label: "TKL", value: int(tkl), sub: isNaN(G) ? "" : `${int(G)}g` },
      { label: "SACKS", value: fmt(sacks, 1) }, { label: "INT", value: int(ints) },
      { label: "TFL", value: int(tfl) }, { label: "FF", value: int(ff) },
    ];
    const paceRatio = ctx.offRow && ctx.league ? clamp(ctx.offRow.playsPg / ctx.league.playsPg, 0.92, 1.08) : 1;
    projected = { tkl: (tkl / G) * paceRatio, sacks: sacks / G, ints: ints / G, pd: pd / G };
    projLabels = [
      { key: "tkl", label: "TACKLES", d: 1, headline: true },
      { key: "sacks", label: "SACKS", d: 2 }, { key: "ints", label: "INT", d: 2 }, { key: "pd", label: "PD", d: 2 },
    ];
    factors = [
      { key: "pace", label: `${ctx.defAbbr} runs ${fmt(ctx.offRow?.playsPg)} plays/g (${ordinal(ctx.offRow?.rankPlays)})`,
        mult: paceRatio, active: !!ctx.offRow, note: "snap-volume proxy" },
    ];
  }

  if (ctx.env && kind !== "DEF") {
    const e = phase === "rush" ? ctx.env.rush : ctx.env.pass;
    if (e && Math.abs(e - 1) > 0.001) {
      factors.push({
        key: "env", label: `League ${phase === "rush" ? "rushing" : "passing"} ${e > 1 ? "up" : "down"} vs ${ctx.statSeason || "last season"}`,
        mult: e, active: true, note: "current-season environment",
      });
    }
  }
  factors.push(weatherFactor(ctx.wx, ctx.indoor, phase === "rush" ? "rush" : "pass"));
  if (ctx.implied != null) {
    factors.push({
      key: "vegas", label: `Implied team total ${ctx.implied.toFixed(1)}`,
      mult: 1, active: false, pending: true, note: "context only — no historical lines to validate against",
    });
  }
  factors.push({
    key: "arch", label: "Defense vs archetype", mult: 1,
    active: false, pending: true, note: "needs charting data",
  });

  const archetype = kind === "DEF" ? null : archetypeOf(p.pos, per);
  headline = projLabels.find((l) => l.headline);

  /* band for the headline stat, rescaled by the same opponent multiplier */
  let band = null;
  if (dist && headline) {
    const m = phase === "rush" ? rushMult : passMult;
    band = { ...dist, p25adj: dist.p25 * m, p75adj: dist.p75 * m, medianAdj: dist.median * m };
  }

  const defRank = kind === "DEF" ? ctx.offRow?.rankPlays
    : phase === "rush" ? D?.rankRushYds : D?.rankPassYds;
  const gs = grades.filter(Boolean).map((g) => GRADE_SCORE[g]);
  const playerScore = gs.length ? mean(gs) : null;
  const softness = defRank ? (defRank - 1) / Math.max(1, (ctx.teams || 32) - 1) : 0.5;
  const score = playerScore === null ? null : Math.round((playerScore * EDGE_W_PLAYER + softness * EDGE_W_OPP) * 100);

  return {
    kind, phase, archetype, factors, projected, seasonCells, projLabels, grades,
    score, verdict: edgeVerdict(score), gamesPlayed: G, volume, dist, band, headline,
    oppHistory: ctx.oppHistory || null, log,
    baselineAtt: typeof baselineAtt === "number" ? baselineAtt : null,
  };
}

function edgeVerdict(score) {
  if (score === null) return { label: "No data", tone: "neutral" };
  if (score >= 72) return { label: "Smash spot", tone: "hot" };
  if (score >= 58) return { label: "Lean", tone: "warm" };
  if (score >= 42) return { label: "Neutral", tone: "neutral" };
  if (score >= 28) return { label: "Soft fade", tone: "cool" };
  return { label: "Fade", tone: "cold" };
}

/* ============================ THE SCANNER ============================ */

const SCAN_PULLS = [
  { sort: "passing.passingYards:desc",     limit: 60  },
  { sort: "receiving.receivingYards:desc", limit: 250 },
  { sort: "rushing.rushingYards:desc",     limit: 150 },
  { sort: "defensive.totalTackles:desc",   limit: 250 },
  { sort: "defensive.sacks:desc",          limit: 120 },
];
const MIN_VOLUME = { QB: 150, REC: 40, RB: 60, DEF: 30 };
const MIN_GAMES = 6;

async function runScan({ year, week, seasonType, league, tables, env, onProgress }) {
  onProgress?.("Loading this week's slate…");
  const { games, byes } = await getSchedule(year, week, seasonType);
  if (!games.length) return { rows: [], games, byes, empty: true };

  const opponent = {};
  games.forEach((g) => {
    opponent[g.home.abbr] = { game: g, opp: g.away.abbr, home: true };
    opponent[g.away.abbr] = { game: g, opp: g.home.abbr, home: false };
  });

  onProgress?.("Pulling league-wide season stats…");
  const pulls = await pool(SCAN_PULLS, 5, (p) => getBulkAthletes(league.season, p.sort, p.limit));

  onProgress?.("Reconciling offseason moves…");
  const teamIds = [];
  games.forEach((g) => { teamIds.push(g.home, g.away); });
  const rosters = await pool(teamIds, 8, (t) => getRoster(t.id));
  const currentTeam = {};
  teamIds.forEach((t, i) => { (rosters[i] || []).forEach((a) => { currentTeam[a.id] = t.abbr; }); });

  const byId = new Map();
  pulls.flat().forEach((p) => { if (!byId.has(p.id)) byId.set(p.id, p); });
  const players = [...byId.values()]
    .map((p) => {
      const team = currentTeam[p.id] || p.team;
      return { ...p, team, moved: currentTeam[p.id] && currentTeam[p.id] !== p.team ? p.team : null };
    })
    .filter((p) => opponent[p.team]);

  onProgress?.("Reading depth charts…");
  const charts = await pool(teamIds, 8, (t) => getDepthChart(t.id, year));
  const depthOf = {};
  const chartQbOf = {};
  teamIds.forEach((t, i) => {
    const c = charts[i] || { ranks: {}, qb: [] };
    Object.entries(c.ranks || {}).forEach(([id, rank]) => { depthOf[id] = rank; });
    chartQbOf[t.abbr] = c.qb || [];
  });

  onProgress?.("Reading game conditions…");
  const details = await pool(games, 8, (g) => getGameDetail(g.id));
  const detailByGame = {};
  games.forEach((g, i) => { detailByGame[g.id] = details[i]; });

  /* Exactly one quarterback per team gets projected. */
  onProgress?.("Confirming starting quarterbacks…");
  const qbUsage = await getQbUsage(year);
  const injByTeam = {};
  details.forEach((d) => {
    Object.entries(d?.injuriesById || {}).forEach(([team, map]) => {
      injByTeam[team] = Object.assign(injByTeam[team] || {}, map);
    });
  });
  const starterQB = {};
  teamIds.forEach((t) => {
    const r = resolveStarterQB(t.abbr, chartQbOf[t.abbr], injByTeam[t.abbr], qbUsage);
    if (r) starterQB[t.abbr] = r;
  });

  /* Positional means for baseline shrinkage, computed from this slate rather
     than hardcoded, so they track the league instead of drifting. */
  const posSamples = { QB: [], REC: [], RB: [] };
  players.forEach((p) => {
    const k = KIND_OF_POS(p.pos);
    if (!posSamples[k]) return;
    /* Only count players we actually project. The QB pool is roughly half
       backups, whose low per-game numbers dragged the mean 44 yards below the
       starters' — and shrinking starters toward that was a standing -9 bias. */
    if (k === "QB") {
      const st = starterQB[p.team];
      if (st && String(p.id) !== st.id) return;
    }
    const s = p.stats || {};
    const gp = num(statOf(s, ["general", "passing", "rushing", "receiving"], ["gamesPlayed"]));
    if (!(gp > 0)) return;
    const v = k === "QB" ? num(s.passing?.passingYards)
      : k === "REC" ? num(s.receiving?.receivingYards) : num(s.rushing?.rushingYards);
    if (!isNaN(v)) posSamples[k].push(v / gp);
  });
  const posMean = {};
  Object.entries(posSamples).forEach(([k, arr]) => {
    posMean[k] = arr.length ? mean(arr) : POS_MEAN_FALLBACK[k];
  });
  const crossSeason = league.season !== year;

  onProgress?.(`Scoring ${players.length} players…`);
  const rows = [];
  for (const p of players) {
    const kind = KIND_OF_POS(p.pos);
    if (!kind) continue;
    /* A backup QB is not a low-value play, it is a non-event. Drop outright
       rather than ranking him — see resolveStarterQB. */
    if (kind === "QB") {
      const st = starterQB[p.team];
      if (st && String(p.id) !== st.id) continue;
    }
    const meta = opponent[p.team];
    const detail = detailByGame[meta.game.id];
    const imp = impliedTotals(meta.game);
    const ctx = {
      defAbbr: meta.opp,
      defRow: tables?.defense?.[meta.opp],
      offRow: tables?.offense?.[meta.opp],
      league: tables?.league,
      teams: tables?.teams || 32,
      wx: detail?.weather,
      indoor: meta.game.indoor || detail?.indoor,
      implied: imp ? (meta.home ? imp.home : imp.away) : null,
      posMean, crossSeason, env, statSeason: league.season,
    };
    const a = analyze(p, kind, ctx);
    if (a.score === null) continue;
    if (!(a.gamesPlayed >= MIN_GAMES)) continue;
    if (!(a.volume >= (MIN_VOLUME[kind] || 0))) continue;
    rows.push({
      player: p, kind, pos: p.pos, team: p.team, opp: meta.opp, home: meta.home,
      moved: p.moved, game: meta.game, ctx, analysis: a, score: a.score,
      depth: depthOf[p.id] || null,
      starter: kind === "QB" ? starterQB[p.team] || null : null,
      state: meta.game.state || "pre", started: hasStarted(meta.game),
      leakage: league.season === year && hasStarted(meta.game),
    });
  }
  rows.sort((a, b) => b.score - a.score);

  /* Enrich only what will be shown: game logs for the top of each board. */
  const groups = { QB: [], RB: [], WR: [], TE: [], DEF: [] };
  rows.forEach((r) => {
    const k = r.kind === "DEF" ? "DEF" : r.pos === "QB" ? "QB"
      : ["RB", "FB"].includes(r.pos) ? "RB" : r.pos === "TE" ? "TE" : "WR";
    if (groups[k] && groups[k].length < 20) groups[k].push(r);
  });
  const toEnrich = [].concat(...Object.values(groups)).filter((r) => r.kind !== "DEF");
  onProgress?.(`Pulling game logs for ${toEnrich.length} players…`);
  const logs = await pool(toEnrich, 8, (r) => getGameLog(r.player.id, league.season));
  toEnrich.forEach((r, i) => {
    if (!logs[i]) return;
    r.ctx = { ...r.ctx, log: logs[i], oppHistory: logs[i].filter((g) => g.opp === r.opp) };
    r.analysis = analyze(r.player, r.kind, r.ctx);
    r.score = r.analysis.score;
  });

  try { saveProjections(year, week, rows); } catch {}

  const started = games.filter(hasStarted);
  const played = started.filter((g) => g.state === "post" || g.completed).length;
  return {
    rows, games, byes, season: league.season, played, live: started.length - played,
    starterQB, posMean,
    statYear: league.season, scanYear: year,
  };
}

/* ====================== RESULTS TRACKER ======================
 * The tool grades itself. Every scan snapshots its projections; once a week
 * is final those snapshots are scored against real box scores. Without this
 * the model can only be argued about, never checked.
 * ============================================================ */

/**
 * Snapshot ONLY what the board displays. Grading the full scan counted deep
 * reserves the board never recommended, which is why the report card showed a
 * ~19% "never played" rate that no amount of starter-gating moved — those
 * players were filtered out of the view but still being graded.
 */
/* What "he played a normal game" means per position, and what we expected. */
const USAGE_STAT = { QB: "passingAttempts", RB: "rushingAttempts", REC: "receivingTargets" };
const USAGE_PROJ = {
  QB: (a) => a.baselineAtt || null,
  RB: (a) => (isFinite(a.projected?.car) ? a.projected.car : null),
  REC: (a) => (isFinite(a.projected?.tgt) ? a.projected.tgt : null),
};
/* Below this share of expected workload the game tells us nothing about the
   matchup read — injury, benching, ejection or a blowout took the sample away. */
const USAGE_FLOOR = 0.5;

const boardVisible = (r) => {
  if (r.started) return false;                       // game already kicked off
  if (r.kind === "DEF" || r.depth == null) return true;
  const lim = DEPTH_LIMIT[r.pos];
  return lim === undefined ? true : r.depth <= lim;
};

function saveProjections(year, week, rows) {
  const snap = rows
    .filter(boardVisible)
    .filter((r) => r.kind !== "DEF" && r.analysis?.headline?.logKey)
    .map((r) => ({
      id: r.player.id, name: r.player.name, pos: r.pos, kind: r.kind,
      team: r.team, opp: r.opp, stat: r.analysis.headline.logKey,
      proj: r.analysis.projected[r.analysis.headline.key],
      /* The median is what an over bet is actually priced against — a mean
         baseline sits above the typical game in a right-skewed distribution. */
      median: r.analysis.band?.medianAdj,
      p25: r.analysis.band?.p25adj, p75: r.analysis.band?.p75adj,
      score: r.score, depth: r.depth || null, gameId: r.game?.id || null,
      /* Expected workload, so a result can be checked for "did he actually
         play a normal game" before it is allowed to score the model. */
      usageStat: USAGE_STAT[r.kind] || null,
      projUsage: USAGE_PROJ[r.kind] ? USAGE_PROJ[r.kind](r.analysis) : null,
    }))
    .filter((x) => isFinite(x.proj));
  if (snap.length) store.set(`gx_proj_${year}_${week}`, { year, week, savedAt: Date.now(), rows: snap });
}

/** Per-player actuals for a finished week, from box scores. */
async function weekActuals(games) {
  const sums = await pool(games.map((g) => g.id), 8, (g) => safeJSON(`${ESPN}/summary?event=${g}`));
  const out = {};
  sums.forEach((s) => {
    (s?.boxscore?.players || []).forEach((tb) => {
      (tb.statistics || []).forEach((cat) => {
        const keys = cat.keys || cat.labels || [];
        (cat.athletes || []).forEach((a) => {
          const id = a.athlete?.id; if (!id) return;
          const rec = out[id] = out[id] || {};
          const vals = {};
          keys.forEach((k, i) => { vals[k] = a.stats?.[i]; });
          if (cat.name === "passing") {
            rec.passingYards = num(vals.passingYards);
            const ca = String(vals["completions/passingAttempts"] || "0/0").split("/");
            rec.passingAttempts = num(ca[1]);
          }
          if (cat.name === "rushing") {
            rec.rushingYards = num(vals.rushingYards);
            rec.rushingAttempts = num(vals.rushingAttempts);
          }
          if (cat.name === "receiving") {
            rec.receivingYards = num(vals.receivingYards);
            rec.receivingTargets = num(vals.receivingTargets);
          }
        });
      });
    });
    /* Current injury status, used only to corroborate a usage collapse — the
       feed has no in-game participation flag, so workload is the real signal. */
    (Array.isArray(s?.injuries) ? s.injuries : []).forEach((blk) => {
      (blk.injuries || []).forEach((x) => {
        const id = x.athlete?.id;
        if (!id) return;
        out[id] = out[id] || {};
        out[id].injStatus = x.status;
      });
    });
  });
  return out;
}

/**
 * Grade a finished week as a BETTOR would read it, not as a modeller would.
 * The question is not "what was the MAE" — it is: of the picks I would have
 * taken, how many went over the number, and where in the projected range did
 * they land.
 *
 * Every pick is also checked for whether it was a fair test at all. A back who
 * saw three carries or a quarterback who threw eight passes tells us nothing
 * about the matchup — he got hurt, benched, ejected, or the game script ran
 * away. Those are separated out rather than silently averaged in.
 */
async function gradeWeek(year, week, force) {
  const gk = `gx_grade_${year}_${week}_v11`;
  if (!force) { const c = store.get(gk); if (c) return c; }
  const snap = store.get(`gx_proj_${year}_${week}`);
  if (!snap?.rows?.length) return { week, year, reason: "nosnap" };
  const { games } = await getSchedule(year, week, 2);
  if (!games.length) return { week, year, reason: "noschedule" };

  /* Only FINAL games can be scored. A game in progress has a partial box score,
     and grading off it understates every player in it. Picks from games that
     are not final yet are held back rather than counted as misses. */
  const isFinal = (g) => g.state === "post" || g.completed === true;
  const final = games.filter(isFinal);
  const finalIds = new Set(final.map((g) => String(g.id)));
  if (!final.length) return { week, year, reason: "notfinal", gamesTotal: games.length, gamesFinal: 0 };

  const gradable = snap.rows.filter((r) => !r.gameId || finalIds.has(String(r.gameId)));
  if (!gradable.length) return { week, year, reason: "notfinal", gamesTotal: games.length, gamesFinal: final.length };

  const actual = await weekActuals(final);
  const picks = gradable.map((r) => {
    const a = actual[r.id] || null;
    const act = a ? a[r.stat] : undefined;
    const played = act !== undefined && !isNaN(act);
    /* Older snapshots predate the median; fall back to the point estimate. */
    const median = isFinite(r.median) ? r.median : r.proj;
    const usageActual = a && r.usageStat ? a[r.usageStat] : undefined;
    const usageRatio = (isFinite(r.projUsage) && r.projUsage > 0 && isFinite(usageActual))
      ? usageActual / r.projUsage : null;
    const collapsed = usageRatio !== null && usageRatio < USAGE_FLOOR;
    const band = isFinite(r.p25) && isFinite(r.p75) && r.p75 > r.p25;
    let zone = null, bandWidths = null;
    if (played && band) {
      zone = act > r.p75 ? "above" : act >= median ? "upper" : act >= r.p25 ? "lower" : "below";
      bandWidths = (act - median) / (r.p75 - r.p25);
    }
    return {
      ...r, median, act: played ? act : null, played,
      over: played ? act > median : null,
      zone, bandWidths, usageActual: isFinite(usageActual) ? usageActual : null,
      usageRatio, collapsed, injStatus: a?.injStatus || null,
    };
  });

  const complete = final.length === games.length;
  const result = {
    year, week, gradedAt: Date.now(), version: 11,
    projected: picks.length,
    played: picks.filter((p) => p.played).length,
    dnp: picks.filter((p) => !p.played).length,
    flagged: picks.filter((p) => p.played && p.collapsed).length,
    gamesTotal: games.length, gamesFinal: final.length, complete,
    heldBack: snap.rows.length - gradable.length,
    snapshotAt: snap.savedAt || null,
    picks,
  };
  /* Never cache a half-finished week — the old build froze a Sunday-afternoon
     grade in place and never revisited it after the night games. */
  if (complete) store.set(gk, result);
  return result;
}

/* ---- cohort maths, shared by the hero, the charts and the table ---- */

const POS_GROUP = (p) => (p.pos === "QB" ? "QB"
  : ["RB", "FB"].includes(p.pos) ? "RB" : p.pos === "TE" ? "TE" : "WR");

/** "Top N per position" is how the board is actually played. */
function topNPerPosition(picks, n) {
  const byPos = {};
  picks.forEach((p) => { (byPos[POS_GROUP(p)] = byPos[POS_GROUP(p)] || []).push(p); });
  const out = [];
  Object.values(byPos).forEach((list) => {
    out.push(...[...list].sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, n));
  });
  return out;
}

function cohortOf(picks, key) {
  if (key === "top3") return topNPerPosition(picks, 3);
  if (key === "top5") return topNPerPosition(picks, 5);
  if (key === "edge75") return picks.filter((p) => (p.score || 0) >= 75);
  return picks;
}

function summarise(picks) {
  const played = picks.filter((p) => p.played);
  const clean = played.filter((p) => !p.collapsed);
  const over = clean.filter((p) => p.over);
  const zones = { below: 0, lower: 0, upper: 0, above: 0 };
  clean.forEach((p) => { if (p.zone) zones[p.zone]++; });
  const zoned = Object.values(zones).reduce((a, b) => a + b, 0);
  const medErr = (() => {
    const d = clean.map((p) => p.median - p.act).sort((a, b) => a - b);
    return d.length ? d[Math.floor(d.length / 2)] : NaN;
  })();
  return {
    n: picks.length, played: played.length, clean: clean.length,
    flagged: played.length - clean.length, dnp: picks.length - played.length,
    overN: over.length,
    overRate: clean.length ? over.length / clean.length * 100 : NaN,
    bigOver: zoned ? zones.above / zoned * 100 : NaN,
    bust: zoned ? zones.below / zoned * 100 : NaN,
    zones, zoned, medErr,
  };
}

/* ====================== THE OVER BOARD ======================
 * Palette note. OVER uses the brand gold #ffc72c, UNDER the reserved critical
 * step #e5484d. Validated against this app's dark green surface #0a2d1a:
 * CVD separation ΔE 24.0 deutan / 25.9 tritan, normal-vision 29.9, contrast
 * above 3:1 on both. The validator's lightness-band check FAILS on the gold
 * (L 0.857 vs the dark band 0.48–0.67) and that deviation is deliberate: the
 * band exists to stop one series dominating a CATEGORICAL set, while this is a
 * two-pole status encoding. Every band-passing gold tested collapsed CVD
 * separation from ΔE 24 to ~7, which is the floor where colour alone stops
 * working. Both poles carry an arrow and a text label, so identity never rests
 * on hue, and a table view of the same rows sits below the charts.
 * ============================================================ */
const OVER_C = "#ffc72c";
const UNDER_C = "#e5484d";

/** Why a week isn't on the board — said plainly, because silent omission is
 *  exactly what made the last missing week take a debugging round to find. */
const GAP_TEXT = (x) => {
  if (x.reason === "nosnap") return "no projections were saved — the Edge Board wasn't open for this week before its games kicked off, so there is nothing to grade against.";
  if (x.reason === "notfinal") return `still in progress — ${x.gamesFinal || 0} of ${x.gamesTotal || "?"} games final.`;
  if (x.reason === "noschedule") return "ESPN returned no schedule for this week.";
  if (x.reason === "error") return `grading failed — ${x.detail || "unknown error"}.`;
  return "not gradeable.";
};

const COHORTS = [
  { key: "top3", label: "Top 3 / position" },
  { key: "top5", label: "Top 5 / position" },
  { key: "edge75", label: "EDGE 75+" },
  { key: "all", label: "Everything" },
];

function StatTile({ label, value, sub, tone }) {
  return (
    <div style={{ minWidth: 118 }}>
      <div style={{ fontSize: 9, color: T.inkFaint, letterSpacing: .8 }}>{label}</div>
      <div style={{
        fontFamily: "'Barlow Condensed',sans-serif", fontSize: 26, fontWeight: 700,
        lineHeight: 1.1, color: tone || T.chalk,
      }}>{value}</div>
      {sub && <div style={{ fontSize: 9, color: T.inkFaint }}>{sub}</div>}
    </div>
  );
}

/**
 * Where each pick landed, measured in band-widths from its own median.
 *
 * Built in HTML rather than SVG on purpose: a percent-width SVG needs
 * preserveAspectRatio="none", which stretches tick labels into illegibility and
 * turns the dots into ellipses. Absolutely-positioned divs keep circles round
 * and text upright at any container width.
 */
function LandingChart({ picks }) {
  const [hover, setHover] = useState(null);
  const CAP = 24;      // a 150-row strip helps nobody; the top of the board is the point
  const eligible = picks.filter((p) => p.played && p.bandWidths !== null && !p.collapsed)
    .sort((a, b) => (b.score || 0) - (a.score || 0));
  const rows = eligible.slice(0, CAP);
  if (!rows.length) return null;

  const LIM = 2;
  const xPct = (v) => ((clamp(v, -LIM, LIM) + LIM) / (2 * LIM)) * 100;
  const ticks = [-2, -1, 0, 1, 2];
  const PLOT = "52%";          // plot column; labels sit either side

  const Legend = () => (
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, color: T.inkDim }}>
        <span style={{ width: 10, height: 10, borderRadius: "50%", background: OVER_C, display: "inline-block" }} />
        ▲ Over the median
      </span>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, color: T.inkDim }}>
        <span style={{ width: 10, height: 10, borderRadius: "50%", background: UNDER_C, display: "inline-block" }} />
        ▼ Under the median
      </span>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, color: T.inkFaint }}>
        <span style={{ width: 18, height: 5, borderRadius: 3, background: "rgba(255,255,255,.26)", display: "inline-block" }} />
        projected 25–75 range
      </span>
    </div>
  );

  return (
    <div>
      <Legend />
      <div style={{ fontSize: 10, color: hover ? T.chalk : T.inkFaint, minHeight: 15, marginBottom: 6 }}>
        {hover
          ? `${hover.name} · ${hover.team} vs ${hover.opp} · median ${hover.median.toFixed(0)}, range ${hover.p25.toFixed(0)}–${hover.p75.toFixed(0)} · actual ${hover.act.toFixed(0)} (${hover.bandWidths >= 0 ? "+" : ""}${hover.bandWidths.toFixed(2)} band-widths)`
          : "0 = his projected median. ±1 = one full band-width away."}
      </div>

      {/* axis */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, paddingBottom: 4 }}>
        <div style={{ flex: "1 1 0", minWidth: 0 }} />
        <div style={{ width: PLOT, position: "relative", height: 13, flexShrink: 0 }}>
          {ticks.map((t) => (
            <span key={t} style={{
              position: "absolute", left: `${xPct(t)}%`, transform: "translateX(-50%)",
              fontSize: 9, color: t === 0 ? T.chalk : T.inkFaint, whiteSpace: "nowrap",
            }}>{t === 0 ? "median" : t > 0 ? `+${t}` : t}</span>
          ))}
        </div>
        <div style={{ width: 92, flexShrink: 0 }} />
      </div>

      {eligible.length > rows.length && (
        <div style={{ fontSize: 9.5, color: T.inkFaint, marginBottom: 4 }}>
          Showing the top {CAP} by EDGE of {eligible.length} clean picks — the rest are in the table view.
        </div>
      )}
      {rows.map((p) => {
        const w = p.p75 - p.p25;
        const lo = xPct((p.p25 - p.median) / w), hi = xPct((p.p75 - p.median) / w);
        const c = p.over ? OVER_C : UNDER_C;
        const on = hover && hover.key === p.key;
        return (
          <div key={p.key}
            onMouseEnter={() => setHover(p)} onMouseLeave={() => setHover(null)}
            style={{
              display: "flex", alignItems: "center", gap: 10, height: 28,
              background: on ? "rgba(255,255,255,.05)" : "transparent", borderRadius: 3,
            }}>
            <div style={{
              flex: "1 1 0", minWidth: 0, fontSize: 11, textAlign: "right",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>
              <span style={{ color: c, fontWeight: 700 }}>{p.over ? "▲" : "▼"}</span>{" "}
              <span style={{ color: T.ink }}>{p.name}</span>
              <span style={{ color: T.inkFaint }}> · {p.pos} · {p.score}</span>
            </div>

            <div style={{ width: PLOT, position: "relative", height: 28, flexShrink: 0 }}
              title={`${p.name} (${p.pos} ${p.team} vs ${p.opp}) — median ${p.median.toFixed(0)}, actual ${p.act.toFixed(0)}`}>
              {/* median rule */}
              <div style={{
                position: "absolute", left: "50%", top: 0, bottom: 0, width: 1,
                background: "rgba(255,255,255,.3)",
              }} />
              {/* projected range */}
              <div style={{
                position: "absolute", left: `${lo}%`, width: `${Math.max(hi - lo, 0.6)}%`,
                top: "50%", marginTop: -2.5, height: 5, borderRadius: 3,
                background: "rgba(255,255,255,.26)",
              }} />
              {/* actual */}
              <div style={{
                position: "absolute", left: `${xPct(p.bandWidths)}%`, top: "50%",
                width: on ? 13 : 11, height: on ? 13 : 11, marginTop: on ? -6.5 : -5.5,
                marginLeft: on ? -6.5 : -5.5, borderRadius: "50%", background: c,
                border: "2px solid #0a2d1a", boxSizing: "content-box",
              }} />
            </div>

            <div style={{ width: 92, flexShrink: 0, fontSize: 11, color: T.inkDim, whiteSpace: "nowrap" }}>
              <strong style={{ color: T.chalk }}>{p.act.toFixed(0)}</strong>
              <span style={{ color: T.inkFaint }}> vs {p.median.toFixed(0)}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/** Ordered-scale share, centred on the median. */
function ZoneBar({ zones, zoned }) {
  if (!zoned) return null;
  /* Ordered arms either side of the median: two steps per arm, darker toward
     the middle. Opacity was tried first and turned the inner segments to mud
     against the green surface. */
  const seg = [
    { k: "below", label: "Under the 25th", c: UNDER_C,   ink: "#1a1208" },
    { k: "lower", label: "25th → median", c: "#8f3034", ink: "#f2f7f3" },
    { k: "upper", label: "median → 75th", c: "#9c7718", ink: "#f2f7f3" },
    { k: "above", label: "Over the 75th", c: OVER_C,    ink: "#1a1208" },
  ];
  return (
    <div>
      <div style={{ display: "flex", height: 26, borderRadius: 3, overflow: "hidden", gap: 2 }}>
        {seg.map((x) => {
          const pct = zones[x.k] / zoned * 100;
          if (!pct) return null;
          return (
            <div key={x.k} title={`${x.label}: ${zones[x.k]} of ${zoned}`}
              style={{
                width: `${pct}%`, background: x.c,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
              <span style={{ fontSize: 10, fontWeight: 700, color: x.ink }}>
                {pct >= 9 ? Math.round(pct) + "%" : ""}
              </span>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 6 }}>
        {seg.map((x) => (
          <span key={x.k} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 9.5, color: T.inkDim }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: x.c, display: "inline-block" }} />
            {x.label} <span style={{ color: T.inkFaint }}>({zones[x.k]})</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function ReportCard({ year, currentWeek }) {
  const [grades, setGrades] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [cohort, setCohort] = useState("top3");
  const [weekSel, setWeekSel] = useState("all");
  const [showTable, setShowTable] = useState(false);
  const [gaps, setGaps] = useState([]);

  const load = useCallback(async (force) => {
    setBusy(true); setMsg("");
    const out = [], miss = [];
    const have = new Set(snapshotWeeks(year));
    /* Walk every week that could possibly be gradeable: up to the current week
       INCLUSIVE, plus any week a snapshot exists for. The old bound stopped one
       short of ESPN's reported week, which hid a week that had just gone final. */
    const last = Math.max(currentWeek || 1, ...(have.size ? [...have] : [1]), 1);
    for (let w = 1; w <= last; w++) {
      const past = w < (currentWeek || 1);
      if (!have.has(w)) { if (past) miss.push({ week: w, reason: "nosnap" }); continue; }
      setMsg(`Grading week ${w}…`);
      let g = null;
      try { g = await gradeWeek(year, w, force); }
      catch (e) { miss.push({ week: w, reason: "error", detail: e.message }); continue; }
      if (g && g.picks) out.push(g); else if (g) miss.push({ week: w, ...g });
    }
    setGrades(out); setGaps(miss); setBusy(false); setMsg("");
  }, [year, currentWeek]);
  useEffect(() => { load(false); }, [load]);

  const allPicks = useMemo(() => {
    const src = weekSel === "all" ? grades : grades.filter((g) => g.week === +weekSel);
    return src.flatMap((g) => g.picks.map((p, i) => ({ ...p, week: g.week, key: `${g.week}-${p.id}-${i}` })));
  }, [grades, weekSel]);

  const picks = useMemo(() => cohortOf(allPicks, cohort), [allPicks, cohort]);
  const sum = useMemo(() => summarise(picks), [picks]);
  const flagged = picks.filter((p) => p.played && p.collapsed);
  const byPos = useMemo(() => {
    const g = {};
    picks.forEach((p) => { (g[POS_GROUP(p)] = g[POS_GROUP(p)] || []).push(p); });
    return Object.entries(g).map(([k, v]) => [k, summarise(v)]).sort((a, b) => b[1].clean - a[1].clean);
  }, [picks]);

  const rateTone = (r) => (isNaN(r) ? T.inkFaint : r >= 55 ? OVER_C : r < 45 ? UNDER_C : T.chalk);

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flexShrink: 0, marginBottom: 12 }}>
        <div style={{
          fontFamily: "'Barlow Condensed',sans-serif", fontSize: 32, fontWeight: 700,
          letterSpacing: 1.5, color: T.chalk, textShadow: `0 2px 0 ${T.leatherDark}`,
        }}>THE OVER <span style={{ color: OVER_C }}>BOARD</span></div>
        <div style={{ fontSize: 11.5, color: T.inkDim, marginTop: 3 }}>
          Of the picks you'd actually have taken, how many cleared their projected median —
          and where in the range they landed.
        </div>
      </div>

      <div className="gx-tabs" style={{ display: "flex", gap: 6, marginBottom: 12, flexShrink: 0, flexWrap: "wrap", alignItems: "center" }}>
        {COHORTS.map((c) => (
          <button key={c.key} onClick={() => setCohort(c.key)} style={{
            padding: "6px 12px", fontSize: 12, fontWeight: 700, borderRadius: 3, cursor: "pointer",
            background: cohort === c.key ? OVER_C : "rgba(0,0,0,.3)",
            color: cohort === c.key ? T.leatherDark : T.ink,
            border: `1px solid ${cohort === c.key ? OVER_C : T.chalkDim}`,
            fontFamily: "'Barlow Condensed',sans-serif", letterSpacing: .8, minHeight: 34,
          }}>{c.label}</button>
        ))}
        <select value={weekSel} onChange={(e) => setWeekSel(e.target.value)} style={{ marginLeft: 4 }}>
          <option value="all">All weeks</option>
          {grades.map((g) => <option key={g.week} value={g.week}>Week {g.week}</option>)}
        </select>
        <button onClick={() => setShowTable((v) => !v)} style={{
          padding: "6px 12px", fontSize: 11, fontWeight: 600, borderRadius: 3, cursor: "pointer",
          background: "rgba(0,0,0,.3)", color: T.inkDim, border: `1px solid ${T.chalkDim}`, minHeight: 34,
        }}>{showTable ? "Hide table" : "Table view"}</button>
        <button onClick={() => load(true)} disabled={busy} style={{
          marginLeft: "auto", padding: "6px 12px", fontSize: 11, fontWeight: 600, borderRadius: 3,
          cursor: busy ? "default" : "pointer", background: "rgba(0,0,0,.3)",
          color: busy ? T.inkFaint : T.ink, border: `1px solid ${T.chalkDim}`, minHeight: 34,
        }}>{busy ? "Grading…" : "↻ Re-grade"}</button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingRight: 5 }}>
        {busy && <Panel style={{ padding: 22 }}><span className="pulsing" style={{ color: OVER_C, fontSize: 12 }}>{msg || "Grading…"}</span></Panel>}

        {!busy && !grades.length && (
          <Panel style={{ padding: "20px 18px", fontSize: 12, color: T.inkDim, lineHeight: 1.6 }}>
            No graded weeks yet. A week becomes gradeable once the Edge Board has scanned it
            <em> before kickoff</em> and its games are final.
          </Panel>
        )}

        {!busy && (gaps.length > 0 || grades.some((g) => !g.complete)) && (
          <Panel style={{ padding: "13px 16px", marginBottom: 12 }}>
            <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1, marginBottom: 9 }}>
              WEEK COVERAGE
            </div>
            {grades.filter((g) => !g.complete).map((g) => (
              <div key={`p${g.week}`} style={{ fontSize: 11.5, color: T.ink, marginBottom: 5 }}>
                <b style={{ color: OVER_C }}>Week {g.week}</b> — graded on {g.gamesFinal} of{" "}
                {g.gamesTotal} games. {g.heldBack > 0 ? `${g.heldBack} picks held back until the rest are final.` : "Re-grade once the week finishes."}
              </div>
            ))}
            {gaps.map((x) => (
              <div key={`g${x.week}`} style={{ fontSize: 11.5, color: T.inkDim, marginBottom: 5 }}>
                <b style={{ color: T.chalk }}>Week {x.week}</b> — {GAP_TEXT(x)}
              </div>
            ))}
            <div style={{ fontSize: 9.5, color: T.inkFaint, marginTop: 9, lineHeight: 1.5 }}>
              A week can only be graded from a snapshot taken while its games were still
              upcoming. Rebuilding one after the fact would feed the results back into the
              projection that is meant to predict them, so missed weeks stay missed. The board
              now pre-snapshots next week automatically whenever you scan this one.
            </div>
          </Panel>
        )}

        {!busy && grades.length > 0 && (
          <>
            {/* the one number */}
            <Panel style={{ padding: "16px 18px", marginBottom: 12 }}>
              <div style={{ display: "flex", gap: 26, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div>
                  <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1 }}>OVER THE PROJECTED MEDIAN</div>
                  <div style={{
                    fontFamily: "'Barlow Condensed',sans-serif", fontSize: 56, fontWeight: 700,
                    lineHeight: 1, color: rateTone(sum.overRate),
                  }}>{isNaN(sum.overRate) ? "—" : Math.round(sum.overRate) + "%"}</div>
                  <div style={{ fontSize: 11, color: T.inkDim }}>
                    {sum.overN} of {sum.clean} clean picks · {COHORTS.find((c) => c.key === cohort).label}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 22, flexWrap: "wrap", paddingBottom: 4 }}>
                  <StatTile label="BIG OVERS" value={isNaN(sum.bigOver) ? "—" : Math.round(sum.bigOver) + "%"}
                    sub="cleared the 75th" tone={OVER_C} />
                  <StatTile label="BUSTS" value={isNaN(sum.bust) ? "—" : Math.round(sum.bust) + "%"}
                    sub="under the 25th" tone={UNDER_C} />
                  <StatTile label="MEDIAN MISS" value={isNaN(sum.medErr) ? "—" : (sum.medErr > 0 ? "+" : "") + sum.medErr.toFixed(0)}
                    sub="+ = projected too high" />
                  <StatTile label="SET ASIDE" value={`${sum.flagged + sum.dnp}`}
                    sub={`${sum.flagged} hurt/benched · ${sum.dnp} never played`} />
                </div>
              </div>
              <div style={{ fontSize: 9.5, color: T.inkFaint, marginTop: 12, lineHeight: 1.5 }}>
                A coin-flip model sits at 50%. Above that, the median is beatable on the over;
                below it, these picks are priced wrong or the projection is too high.
                Picks where the player saw under {Math.round(USAGE_FLOOR * 100)}% of his expected
                workload are excluded — those say nothing about the matchup.
              </div>
            </Panel>

            {/* where they landed */}
            <Panel style={{ padding: "14px 16px", marginBottom: 12 }}>
              <div style={{ fontSize: 10, color: T.inkFaint, letterSpacing: 1, marginBottom: 10 }}>
                WHERE EACH PICK LANDED IN ITS RANGE
              </div>
